<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>콕! — 솔로 파티 운영 앱</title>
<style>
  :root{
    --bg:#0b0918;
    --surface:rgba(255,255,255,.055);
    --surface-2:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.11);
    --text:#f4f1ff;
    --muted:#a49fc0;
    --pink:#ff4d8d;
    --violet:#8b5cf6;
    --gold:#ffd166;
    --mint:#34d399;
    --blue:#60a5fa;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(255,77,141,.22), transparent 60%),
      radial-gradient(760px 480px at 92% 4%, rgba(139,92,246,.24), transparent 62%),
      radial-gradient(700px 600px at 50% 105%, rgba(52,211,153,.10), transparent 60%);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}

  .protobar{
    position:relative;z-index:5;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    padding:7px 12px;font-size:11.5px;
    background:rgba(255,209,102,.10);border-bottom:1px solid rgba(255,209,102,.22);color:#ffd88a;
  }
  .protobar b{font-weight:700}
  .protobar select{background:rgba(0,0,0,.35);color:#ffe6b0;border:1px solid rgba(255,209,102,.3);border-radius:8px;padding:4px 7px;font-size:11.5px;max-width:170px}
  .protobar .pb-btn{background:rgba(255,209,102,.16);border:1px solid rgba(255,209,102,.3);color:#ffd88a;border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:600}
  .protobar .pb-btn:hover{background:rgba(255,209,102,.26)}

  .shell{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;transition:max-width .2s ease}
  .shell.wide{max-width:min(1440px, 100%)}
  .screen{flex:1;display:flex;flex-direction:column;padding:0 18px 110px}
  .screen.no-nav{padding-bottom:32px}

  h1,h2,h3{margin:0;letter-spacing:-.02em}
  .eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .muted{color:var(--muted)}
  .tiny{font-size:11.5px}

  .entry{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:40px 0}
  .logo{font-size:60px;line-height:1;text-align:center;filter:drop-shadow(0 8px 26px rgba(255,77,141,.55));animation:bob 2.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
  .entry h1{font-size:32px;text-align:center;line-height:1.22;font-weight:800}
  .entry h1 em{font-style:normal;background:linear-gradient(100deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .entry p{text-align:center;color:var(--muted);font-size:14px;line-height:1.65;margin:0}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:15px;font-size:15.5px;font-weight:700;transition:transform .12s ease,filter .15s ease,background .15s ease}
  .btn:active{transform:scale(.975)}
  .btn-primary{background:linear-gradient(100deg,var(--pink),var(--violet));color:#fff;box-shadow:0 12px 30px -12px rgba(255,77,141,.85)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-gold{background:linear-gradient(100deg,var(--gold),#fb923c);color:#3b2600}
  .btn-sm{padding:9px 13px;border-radius:11px;font-size:13px;width:auto}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn-row{display:flex;gap:9px}
  .btn-row .btn{width:auto;flex:1}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px}
  .topbar .who{display:flex;align-items:center;gap:10px;min-width:0}
  .topbar .who .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .avatar{width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff}
  .avatar.lg{width:66px;height:66px;border-radius:20px;font-size:26px}
  .avatar.sm{width:32px;height:32px;border-radius:10px;font-size:13px}
  .av-M{background:linear-gradient(140deg,#4f7cff,#8b5cf6)}
  .av-F{background:linear-gradient(140deg,#ff4d8d,#ff8a5c)}

  .strip{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
  .strip .cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .strip .cell .k{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:3px}
  .strip .cell .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .strip .cell.hot .v{color:var(--pink)}
  .strip .cell.time .v{color:var(--gold)}
  .strip .cell.done{background:linear-gradient(100deg,rgba(255,77,141,.18),rgba(139,92,246,.18));border-color:rgba(255,77,141,.35)}

  .sect{margin-bottom:20px}
  .sect-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;gap:10px}
  .sect-head h2{font-size:16.5px;font-weight:800}

  .segmented{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .segmented button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .segmented button.on{background:var(--surface-2);color:var(--text)}

  .cards{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;transition:border-color .15s ease,background .15s ease}
  .card:hover{background:var(--surface-2)}
  .card.poked{border-color:rgba(255,77,141,.5);background:linear-gradient(100deg,rgba(255,77,141,.13),rgba(139,92,246,.08))}
  .card .info{flex:1;min-width:0}
  .card .info .l1{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
  .card .info .nm{font-weight:800;font-size:15.5px}

  .charms{display:flex;flex-wrap:wrap;gap:4px}
  .charm-line{
    font-size:12px;color:#cfc9e8;line-height:1.45;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .charm-line.muted{color:var(--muted)}
  .charm-input{position:relative;flex:1;min-width:0}
  .charm-input .input{padding-right:52px}
  .charm-cnt{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-size:11px;font-weight:700;color:#6f6a8c;font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .charm-cnt.near{color:var(--gold)}
  .charm{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.07);color:#cfc9e8;border:1px solid rgba(255,255,255,.07)}

  .tag{font-size:10.5px;font-weight:800;padding:2.5px 7px;border-radius:7px}
  .tag-NT{background:rgba(139,92,246,.2);color:#c4b5fd}
  .tag-NF{background:rgba(52,211,153,.18);color:#6ee7b7}
  .tag-SJ{background:rgba(96,165,250,.18);color:#93c5fd}
  .tag-SP{background:rgba(251,191,36,.18);color:#fcd34d}

  .poke-btn{flex:0 0 auto;min-width:46px;height:46px;padding:0 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:18px;display:flex;align-items:center;justify-content:center;gap:3px;transition:transform .12s ease}
  .poke-btn:hover{background:rgba(255,77,141,.2)}
  .poke-btn:active{transform:scale(.88)}
  .poke-btn.on{background:linear-gradient(140deg,var(--pink),var(--violet));border-color:transparent;box-shadow:0 8px 20px -10px rgba(255,77,141,.9)}
  .poke-btn .n{font-size:13px;font-weight:800}
  .poke-btn.pop{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-10deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
  .poke-btn:disabled{opacity:.3}

  .stepper{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
  .stepper button{width:42px;height:42px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:800}
  .stepper button:disabled{opacity:.3}
  .stepper .n{font-size:22px;font-weight:800;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

  .alert{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .alert .bell{width:44px;height:44px;border-radius:14px;flex:0 0 auto;background:linear-gradient(140deg,rgba(255,77,141,.28),rgba(139,92,246,.28));display:flex;align-items:center;justify-content:center;font-size:20px}
  .alert.mutual{border-color:rgba(255,209,102,.5);background:linear-gradient(100deg,rgba(255,209,102,.14),rgba(255,77,141,.1))}
  .alert.seat{border-color:rgba(52,211,153,.4);background:linear-gradient(100deg,rgba(52,211,153,.13),rgba(96,165,250,.1))}
  .alert.seat .bell{background:linear-gradient(140deg,rgba(52,211,153,.3),rgba(96,165,250,.3))}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty .ico{font-size:38px;margin-bottom:12px;opacity:.75}
  .empty p{margin:0;font-size:13.5px;line-height:1.6}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .field label .req{color:var(--pink)}
  .input{width:100%;padding:14px;border-radius:13px;font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--text);outline:none;transition:border-color .15s ease}
  .input:focus{border-color:rgba(255,77,141,.6)}
  .input::placeholder{color:#6f6a8c}
  .input.sm{padding:11px 12px;font-size:14px}
  select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23a49fc0' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
  select.input option{background:#171233;color:#f4f1ff}
  .input-at{display:flex;align-items:center;gap:2px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;transition:border-color .15s ease}
  .input-at:focus-within{border-color:rgba(255,77,141,.6)}
  .input-at span{color:var(--muted);font-size:15px;font-weight:700;flex:0 0 auto}
  .input-at input{flex:1;min-width:0;padding:14px 0;font-size:15px;background:none;border:none;color:var(--text);outline:none}
  .input-at input::placeholder{color:#6f6a8c}
  .charm-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .charm-row .num{width:26px;height:26px;flex:0 0 auto;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .choice button{padding:14px;border-radius:13px;font-size:15px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
  .choice button.on{color:#fff;border-color:transparent}
  .choice button.on[data-g="M"]{background:linear-gradient(140deg,#4f7cff,#8b5cf6)}
  .choice button.on[data-g="F"]{background:linear-gradient(140deg,#ff4d8d,#ff8a5c)}
  .axis{margin-bottom:11px}
  .axis-q{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .axis-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .axis-opts button{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-align:left}
  .axis-opts button b{font-size:15px;font-weight:800;flex:0 0 auto}
  .axis-opts button span{font-size:11.5px;font-weight:600;line-height:1.35}
  .axis-opts button.on{background:linear-gradient(140deg,var(--violet),var(--pink));color:#fff;border-color:transparent}
  .mbti-out{margin-top:12px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
  .mbti-out b{display:inline-block;margin-left:6px;font-size:17px;font-weight:800;letter-spacing:.12em;color:var(--text)}
  .err{color:#ff8fa8;font-size:12.5px;margin:-6px 0 12px}
  .input.bad,.input-at.bad{border-color:#ff6b8a;background:rgba(255,77,141,.08)}
  .field-err{display:flex;align-items:center;gap:5px;color:#ff8fa8;font-size:12px;font-weight:600;line-height:1.5;margin-top:7px;animation:shakeIn .3s ease}
  .field-err::before{content:"⚠️";font-size:11px}
  @keyframes shakeIn{0%{opacity:0;transform:translateX(-5px)}40%{transform:translateX(4px)}70%{transform:translateX(-2px)}100%{opacity:1;transform:translateX(0)}}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:20;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(14,11,30,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;color:var(--muted);font-size:10.5px;font-weight:700;position:relative}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.on{color:var(--text)}
  .nav .badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

  .sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(6,4,16,.72);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:480px;background:#171233;border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 18px}

  .host-row.tappable{cursor:pointer;transition:background .15s ease}
  .host-row.tappable:hover{background:var(--surface-2)}
  .kv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
  .kv .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:12.5px;color:var(--muted)}
  .kv .r + .r{border-top:1px solid rgba(255,255,255,.06)}
  .kv .r b{color:var(--text);font-weight:700;text-align:right;word-break:break-all}
  .use{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .use-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
  .use-top b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  .use-top em{font-style:normal;font-weight:800;font-size:15px}
  .meter{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;border-radius:5px;transition:width .25s ease}
  .poke-badge{flex:0 0 auto;font-size:12.5px;font-weight:800;padding:5px 9px;border-radius:9px;background:var(--surface-2);font-variant-numeric:tabular-nums}
  .btn-danger{background:linear-gradient(100deg,#ff4d6d,#c026d3);color:#fff;box-shadow:0 12px 30px -12px rgba(255,77,109,.85)}

  .code-input{text-align:center;letter-spacing:.34em;font-size:23px;font-weight:800;text-transform:uppercase;padding:17px 14px}
  .code-input::placeholder{letter-spacing:.34em;color:#4a4568}
  .proto-list{background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.2);border-radius:14px;padding:10px 12px}
  .proto-list summary{font-size:11.5px;font-weight:700;color:#ffd88a;cursor:pointer;list-style:none}
  .proto-list summary::-webkit-details-marker{display:none}
  .proto-list .ev-card{margin-top:10px;margin-bottom:0}

  .pk-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .pk-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .pk-top span{font-size:12.5px;font-weight:700;color:var(--muted)}
  .pk-top b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .pk-top b em{font-style:normal;font-size:13px;color:var(--muted);margin-left:2px}
  .pk-row{display:flex;align-items:center;gap:11px}
  .pk-btn{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:19px;font-weight:800}
  .pk-btn:hover:not(:disabled){background:rgba(255,77,141,.2)}
  .pk-btn:disabled{opacity:.28}
  .pk-dots{flex:1;display:flex;gap:5px;align-items:center}
  .pk-dots .dot{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.1);border:none;padding:0;transition:background .15s ease}
  .pk-dots .dot:hover{background:rgba(255,255,255,.24)}
  .pk-dots .dot.on{background:linear-gradient(90deg,var(--pink),var(--violet))}
  .pk-est{margin-top:11px;font-size:11.5px;line-height:1.65;color:var(--muted)}
  .pk-est b{color:var(--text);font-weight:700}
  .locked-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:13px;font-size:13px}
  .locked-row span{color:var(--muted);font-size:12px}
  .locked-row b{font-weight:700}

  .steps{display:flex;gap:6px;margin-bottom:18px}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
  .step i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1);color:var(--muted);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800}
  .step span{font-size:10.5px;font-weight:700;color:var(--muted)}
  .step.on{border-color:rgba(255,77,141,.5);background:linear-gradient(160deg,rgba(255,77,141,.16),rgba(139,92,246,.1))}
  .step.on i{background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff}
  .step.on span{color:var(--text)}
  .step.done i{background:rgba(52,211,153,.25);color:#6ee7b7}
  .step.done span{color:#8ee7c0}

  /* ── 데모 뷰: 참가자 화면 나란히 보기 ── */
  .demo-wrap{max-width:none;padding:0 14px 28px}
  .demo-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
  .demo-bar .lbl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em}
  .demo-bar select{background:rgba(0,0,0,.3);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
  .demo-step{padding:7px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
  .demo-step.on{background:linear-gradient(100deg,var(--pink),var(--violet));border-color:transparent;color:#fff}
  .demo-step:hover:not(:disabled){background:rgba(255,255,255,.14)}
  .demo-step:disabled{opacity:.35;cursor:not-allowed}
  .phones{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
  .phone{
    position:relative;flex:0 0 auto;width:330px;height:660px;

<script>
/* ══════════════════════════════════════════════════════════
   데이터 모델 — 회차(event) 단위로 완전히 분리
   프로토타입이라 메모리에만 저장됩니다 (새로고침 시 초기화)
   ══════════════════════════════════════════════════════════ */
const MBTI = ["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP",
              "ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];

// MBTI를 16개 중 고르게 하는 대신 4문항으로 물어본다 (모르는 사람도 답할 수 있게)
const MBTI_AXES = [
  { q:"사람들과 있을 때 에너지가",  opts:[["E","충전돼요"],["I","소모돼요"]] },
  { q:"관심이 더 가는 쪽은",        opts:[["N","가능성·아이디어"],["S","현실·경험"]] },
  { q:"결정할 때 더 기대는 건",     opts:[["T","논리·근거"],["F","마음·관계"]] },
  { q:"일정은",                     opts:[["J","미리 계획하는 편"],["P","그때그때 정하는 편"]] },
];

const PHASES = {
  prep:    { label:"준비 중",   cls:"ph-prep" },
  reg:     { label:"등록 중",   cls:"ph-reg" },
  prevote: { label:"사전 투표", cls:"ph-prevote" },
  party:   { label:"파티 진행", cls:"ph-party" },
  done:    { label:"발표 완료", cls:"ph-done" },
};
const PHASE_ORDER = ["prep","reg","prevote","party","done"];

// 단계를 넘길 때 무엇이 바뀌는지 운영자에게 명확히 알린다
// 수동 진행이 예약과 얼마나 어긋나는지 한 줄로 알려준다
function schedDiffLine(ev, to){
  const key = SCHED_OF[to];
  if(!key || !ev[key]) return null;
  const gap = ev[key] - Date.now();
  const what = { reg:"등록 시작", party:"사전 투표 마감", done:"발표" }[to];
  if(gap > 60000)  return ["예약과 차이", `예약된 ${what}은 ${fmtDT(ev[key])} — <b style="color:var(--gold)">${fmtGap(gap)} 일찍</b> 진행됩니다. 남은 예약은 해제돼요.`];
  if(gap < -60000) return ["예약과 차이", `예약된 ${what}(${fmtDT(ev[key])})이 <b style="color:var(--gold)">${fmtGap(gap)} 지났어요.</b>`];
  return ["예약", `예약 시각(${fmtDT(ev[key])})과 거의 같습니다.`];
}

function phaseAction(ev, to){
  const A = {
    reg: {
      btn: "참가자 등록 시작",
      title: "참가자 등록을 시작할까요?",
      lines: [
        ["참가자", `입장 코드 ${ev.code}로 들어와 등록할 수 있게 됩니다`],
        ["콕 찌르기", "아직 잠겨 있어요"],
      ],
    },
    prevote: {
      btn: "사전 투표 시작",
      title: "사전 투표를 시작할까요?",
      lines: [
        ["참가자", `1인당 ${ev.maxPre}회씩 콕을 찌를 수 있게 됩니다`],
        ["등록", "계속 열려 있어요 — 늦게 온 사람도 참가할 수 있습니다"],
        ["마감", `${fmtDT(ev.voteCloseAt)}이 지나면 자동으로 파티 진행으로 넘어갑니다`],
      ],
    },
    party: {
      btn: "파티 진행 시작",
      title: "사전 투표를 마감하고 파티를 시작할까요?",
      lines: [
        ["사전 투표", "지금 순위로 마감됩니다"],
        ["콕 예산", `파티용으로 1인당 ${ev.maxParty}회가 새로 지급됩니다`],
        ["기존 콕", "사전 투표에서 찌른 건 그대로 남습니다"],
      ],
    },
    done: {
      btn: "결과 발표",
      title: "결과를 발표할까요?",
      danger: true,
      lines: [
        ["참가자", "서로 찌른 상대를 바로 확인하게 됩니다"],
        ["콕 찌르기", "즉시 마감됩니다"],
        ["되돌리기", "발표를 취소해도 이미 본 사람에게는 소용이 없어요"],
      ],
    },
  };
  const a = A[to];
  if(!a) return null;
  const lines = a.lines.slice();
  const d = schedDiffLine(ev, to);
  if(d) lines.push(d);
  // 사전 투표를 시작하는데 마감이 이미 지났으면 곧바로 끝나버린다
  if(to === "prevote" && ev.voteCloseAt && ev.voteCloseAt <= Date.now())
    lines.push(["⚠️ 주의", `사전 투표 마감(${fmtDT(ev.voteCloseAt)})이 이미 지나 <b style="color:#ff8fa8">시작하자마자 마감됩니다.</b> 설정에서 마감을 늦춰주세요.`]);
  return { ...a, lines };
}

const DB = {
  masterPin: "0000",   // 전체 관리자 공통 PIN
  // 새 회차를 만들 때 물려받는 기본값 — 운영자가 '기본 설정'에서 바꿉니다
  // 테이블 수는 여기에 없습니다 — 자리 배정할 때마다 그 자리에서 고릅니다
  defaults: {
    maxPre: 3,           // 사전 투표 콕 횟수 (1~5)
    maxParty: 3,         // 파티 중 콕 횟수 (1~10)
    regOpenAfterH: 1,    // 회차 생성 후 N시간 뒤 등록 시작
    voteWindowH: 24,     // 등록 시작 후 N시간 뒤 사전 투표 마감
  },
  events: [],
  seq: 1,
};

const S = {
  screen: "entry",   // entry | register | main | hostPin | hostEvents | hostConsole
  tab: "people",
  hostTab: "dash",
  evId: null,        // 참가자가 선택한 회차
  meId: null,
  hostEvId: null,    // 운영자가 보고 있는 회차
  auth: null,        // null | "master" | eventId
  pinBuf: "",
  pinTarget: null,   // "master" | eventId  (어디에 로그인 시도 중인지)
  pinErr: "",
  onlyOpposite: true,
  sheet: null,
  confirm: null,     // 콕 확인 다이얼로그 대상
  hostSheet: null,   // 운영자가 열어본 참가자 상세
  hostConfirm: null, // 운영자 확인 다이얼로그 {type, id}
  // 데모 뷰: 여러 참가자 화면을 동시에 띄우기 위한 독립 상태
  wizard: null,      // 회차 생성 위저드
  regFromDemo: false, // 데모 화면에서 등록으로 넘어왔는지
  regStep: 1,        // 참가자 등록 단계
  entryCode: "",     // 입장 코드 입력값
  entryErr: "",      // 입장 실패 사유
  demoEvId: null,
  paneCount: 2,
  panes: [0,1,2].map(() => ({ evId:null, meId:null, tab:"people", sheet:null, confirm:null, onlyOpposite:true })),
  draft: emptyDraft(),
};

function emptyDraft(){
  return { nick:"", name:"", age:"", phone:"", insta:"", gender:"", axes:["","","",""], charms:["","",""] };
}

/* ── 유틸 ─────────────────────────────────────── */
const $   = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n) => String(n).padStart(2,"0");

const EV     = (id) => DB.events.find(e => e.id === id) || null;
const curEv  = () => EV(S.evId);
const hostEv = () => EV(S.hostEvId);
const P      = (ev, id) => ev ? ev.players.find(p => p.id === id) || null : null;
const me     = () => P(curEv(), S.meId);

function dn(p){ return (p && (p.nick || p.name)) || "?"; }
function nickKey(v){ return String(v||"").trim().toLowerCase().replace(/\s+/g,""); }
function mbtiGroup(m){ if(!m) return "SJ"; if(m[1]==="N") return m[2]==="T"?"NT":"NF"; return m[3]==="J"?"SJ":"SP"; }
function isIntrovert(p){ return p.mbti && p.mbti[0] === "I"; }

function fmtDur(ms){
  if(ms <= 0) return "00:00";
  const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
const DOW = ["일","월","화","수","목","금","토"];
function fmtDT(ms){
  if(!ms) return "미설정";
  const d = new Date(ms);
  return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toLocalInput(ms){
  if(!ms) return "";
  const d = new Date(ms - new Date(ms).getTimezoneOffset()*60000);
  return d.toISOString().slice(0,16);
}
function fromLocalInput(v){ const t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; }

function normInsta(v){
  let s = String(v||"").trim();
  if(!s) return "";
  s = s.replace(/^https?:\/\//i,"").replace(/^(www\.)?instagram\.com\//i,"");
  return s.split(/[/?#]/)[0].replace(/^@+/,"").trim();
}

function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* 테스트에서 결과를 재현할 수 있도록 교체 가능한 난수 */
let RND = Math.random;
function seedRng(seed){
  let s = seed >>> 0 || 1;
  RND = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* ══════════════════════════════════════════════════════════
   회차
   ══════════════════════════════════════════════════════════ */
// 헷갈리는 글자(0/O/1/I)는 뺀 6자리 입장 코드
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genCode(){
  for(let tries = 0; tries < 50; tries++){
    let c = "";
    for(let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(RND() * CODE_CHARS.length)];
    if(!DB.events.some(e => e.code === c)) return c;
  }
  return "P" + Date.now().toString(36).slice(-5).toUpperCase();
}
function findByCode(code){
  const c = String(code||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  return c ? DB.events.find(e => e.code === c) || null : null;
}

function newEvent(name, pin, opts){
  const now = Date.now();
  const D = DB.defaults;
  const o = opts || {};
  const regOpenAt = o.regOpenAt !== undefined ? o.regOpenAt : now + D.regOpenAfterH * 3600000;
  const ev = {
    id: "e" + (DB.seq++),
    code: (o.code && !DB.events.some(e => e.code === o.code)) ? o.code : genCode(),
    name: name || `${DB.events.length + 1}회차 솔로 파티`,
    pin: pin || String(1000 + Math.floor(RND()*9000)),
    phase: "prep",
    regOpenAt,                                            // 등록 시작
    voteCloseAt: o.voteCloseAt !== undefined ? o.voteCloseAt : regOpenAt + D.voteWindowH * 3600000,
    revealAt:    null,                                    // 발표 시각
    revealed: false,
    fired: {},        // 각 단계가 실제로 진행된 시각
    maxPre: o.maxPre !== undefined ? o.maxPre : D.maxPre,
    maxParty: o.maxParty !== undefined ? o.maxParty : D.maxParty,
    tables: 4,        // 자리 탭에서 고르는 값 (라운드마다 바꿀 수 있음)
    players: [],
    pokes: [],        // {from,to,at,phase:'pre'|'party'}
    seating: [],      // {round, seats:{}, status:'draft'|'published', at, metrics}
    pseq: 1,
  };
  DB.events.push(ev);
  return ev;
}

/* 예약 시각은 '그 전환에 대한 1회용 알람'이다.
   전환이 한 번 일어나면(수동이든 자동이든) fired 에 기록되고 알람은 다시 울리지 않는다.
   예약 시각 자체는 지우지 않고 남겨 두어 '예약 20:00 · 19:30 진행' 이력으로 보여준다. */
const SCHED_OF = { reg:"regOpenAt", party:"voteCloseAt", done:"revealAt" };

function phaseOf(ev){
  if(!ev) return "prep";
  ev.fired = ev.fired || {};
  // 단계를 직접 지정한 경우에도 이미 지나온 전환은 '진행됨'으로 채워 둔다
  const idx = PHASE_ORDER.indexOf(ev.phase);
  for(let i = 1; i <= idx; i++){
    const k = PHASE_ORDER[i];
    if(ev.fired[k]) continue;
    const sk = SCHED_OF[k];
    ev.fired[k] = (sk && ev[sk] && ev[sk] <= Date.now()) ? ev[sk] : Date.now();
  }
  if(ev.phase === "prep"    && ev.regOpenAt   && !ev.fired.reg   && Date.now() >= ev.regOpenAt)   setPhase(ev, "reg");
  if(ev.phase === "prevote" && ev.voteCloseAt && !ev.fired.party && Date.now() >= ev.voteCloseAt) setPhase(ev, "party");
  if(ev.phase === "party"   && ev.revealAt    && !ev.fired.done  && Date.now() >= ev.revealAt)    setPhase(ev, "done");
  return ev.phase;
}

// 이미 지나온 전환의 시각만 잠근다 — 아직 오지 않은 일정은 진행 중에도 조정할 수 있다
function schedLocked(ev, key){
  const f = ev.fired || {};
  if(key === "regOpenAt")   return !!f.reg;
  if(key === "voteCloseAt") return !!f.party;
  if(key === "revealAt")    return !!f.done;
  return false;
}
function fmtGap(ms){
  const m = Math.round(Math.abs(ms) / 60000);
  if(m < 1) return "1분 이내";
  if(m < 60) return `${m}분`;
  const h = Math.floor(m/60), r = m % 60;
  return r ? `${h}시간 ${r}분` : `${h}시간`;
}
function isRevealed(ev){ return !!ev && (ev.revealed || phaseOf(ev) === "done"); }
function canRegister(ev){
  if(!ev) return { ok:false, why:"회차를 선택해주세요." };
  const ph = phaseOf(ev);
  if(ph === "prep")  return { ok:false, why:`${fmtDT(ev.regOpenAt)}부터 등록이 열립니다.` };
  if(ph === "done")  return { ok:false, why:"이 회차는 종료되었어요." };
  if(ev.regOpenAt && Date.now() < ev.regOpenAt)
    return { ok:false, why:`등록은 ${fmtDT(ev.regOpenAt)}부터 시작됩니다.` };
  return { ok:true };
}

/* ══════════════════════════════════════════════════════════
   콕 찌르기 — 같은 사람에게 중복 가능, 0회도 가능
   ══════════════════════════════════════════════════════════ */
function pokePhase(ev){ return phaseOf(ev) === "prevote" ? "pre" : "party"; }
function pokeBudget(ev){ return phaseOf(ev) === "prevote" ? ev.maxPre : ev.maxParty; }
function canPoke(ev){ const ph = phaseOf(ev); return ph === "prevote" || ph === "party"; }

function pokeCount(ev, a, b, phase){
  return ev.pokes.filter(p => p.from === a && p.to === b && (!phase || p.phase === phase)).length;
}
function sentCount(ev, id, phase){
  return ev.pokes.filter(p => p.from === id && (!phase || p.phase === phase)).length;
}
function gotPokes(ev, id, phase){
  return ev.pokes.filter(p => p.to === id && (!phase || p.phase === phase));
}
function leftPokes(ev, id){
  return Math.max(0, pokeBudget(ev) - sentCount(ev, id, pokePhase(ev)));
}
function isMutual(ev, a, b){ return pokeCount(ev,a,b) > 0 && pokeCount(ev,b,a) > 0; }
function mutualPairs(ev){
  const out = [], seen = new Set();
  for(const pk of ev.pokes){
    const k = pk.from < pk.to ? pk.from+"|"+pk.to : pk.to+"|"+pk.from;
    if(seen.has(k)) continue;
    if(isMutual(ev, pk.from, pk.to)){
      seen.add(k);
      const [x,y] = k.split("|");
      const a = P(ev,x), b = P(ev,y);
      if(a && b) out.push([a,b]);
    }
  }
  return out;
}

/* 참가자 화면 컨텍스트
   일반 화면은 pane = -1 (전역 S), 데모 뷰는 pane = 0,1,2 (S.panes[i]).
   덕분에 여러 참가자 화면을 동시에 띄워도 서로 간섭하지 않습니다. */
function paneState(pane){
  return (pane === undefined || pane === null || pane < 0) ? S : (S.panes[pane] || S);
}
function vctx(pane){
  const pn = (pane === undefined || pane === null) ? -1 : pane;
  const st = paneState(pn);
  const ev = EV(st.evId);
  return { pane: pn, st, ev, m: P(ev, st.meId) };
}
function goTab(t, pane){ paneState(pane).tab = t; render(); }
function setSheet(id, pane){ paneState(pane).sheet = id || null; render(); }
function setOpp(v, pane){ paneState(pane).onlyOpposite = !!v; render(); }

function pokeGuard(c, targetId){
  const t = P(c.ev, targetId);
  if(!c.ev || !c.m || !t || t.id === c.m.id) return null;
  if(!canPoke(c.ev)){ toast("지금은 콕을 찌를 수 있는 시간이 아니에요"); return null; }
  if(t.gender === c.m.gender){ toast("이성에게만 찌를 수 있어요"); return null; }
  if(leftPokes(c.ev, c.m.id) <= 0){ toast(`이번 라운드 콕을 모두 썼어요 (최대 ${pokeBudget(c.ev)}회)`); return null; }
  return t;
}

// 실수로 눌리는 걸 막기 위해 바로 반영하지 않고 확인을 받는다
function askPoke(targetId, ev2, pane){
  if(ev2) ev2.stopPropagation();
  const c = vctx(pane);
  if(!pokeGuard(c, targetId)) return;
  c.st.confirm = targetId;
  render();
}
function cancelConfirm(pane){ paneState(pane).confirm = null; render(); }
function confirmPoke(pane){
  const st = paneState(pane);
  const id = st.confirm;
  st.confirm = null;
  if(id) addPoke(id, null, pane);
}

function addPoke(targetId, ev2, pane){
  if(ev2) ev2.stopPropagation();
  const c = vctx(pane);
  const t = pokeGuard(c, targetId);
  if(!t) return;

  c.ev.pokes.push({ from:c.m.id, to:targetId, at:Date.now(), phase:pokePhase(c.ev) });
  render();
  const btn = document.querySelector(`[data-poke="${c.pane}:${targetId}"]`);
  if(btn) btn.classList.add("pop");
  const n = pokeCount(c.ev, c.m.id, targetId, pokePhase(c.ev));
  toast(`${dn(t)}님에게 콕! ${n > 1 ? `(누적 ${n}회) ` : ""}— 남은 횟수 ${leftPokes(c.ev, c.m.id)}회`);
}
function removePoke(targetId, ev2, pane){
  if(ev2) ev2.stopPropagation();
  const c = vctx(pane);
  if(!c.ev || !c.m || !canPoke(c.ev)) return;
  const ph = pokePhase(c.ev);
  for(let i = c.ev.pokes.length - 1; i >= 0; i--){
    const p = c.ev.pokes[i];
    if(p.from === c.m.id && p.to === targetId && p.phase === ph){ c.ev.pokes.splice(i,1); break; }
  }
  render();
  toast(`콕을 하나 취소했어요 — 남은 횟수 ${leftPokes(c.ev, c.m.id)}회`);
}

/* 사전투표 남/녀 1위 — 운영자에게 실시간 노출 */
function preTop(ev, gender){
  const list = ev.players
    .filter(p => p.gender === gender)
    .map(p => ({ p, n: gotPokes(ev, p.id, "pre").length }))
    .sort((a,b) => b.n - a.n || dn(a.p).localeCompare(dn(b.p)));
  if(!list.length || list[0].n === 0) return null;
  const top = list[0].n;
  return { n: top, players: list.filter(x => x.n === top).map(x => x.p) };
}

/* ══════════════════════════════════════════════════════════
   자리 배정
   하드 제약: 테이블별 남/여 정원 (성비 최우선)
   소프트 비용: 10살 이상 차이 회피 > 이전 라운드 재회 회피 > I/E 혼합, 콕 반영은 보너스
   ══════════════════════════════════════════════════════════ */
// 나이차 벌점(AGE)이 항상 가장 크다 → 재회 회피가 나이 제약을 절대 밀어내지 못한다.
const W = { AGE: 30, REP: 8, IE: 4, POKE_MUTUAL: 12, POKE_ONE: 4 };

function spread(n, T){
  const base = Math.floor(n/T), rest = n % T;
  return Array.from({length:T}, (_,i) => base + (i < rest ? 1 : 0));
}
// 총원을 고르게 나눈 뒤 각 테이블 정원 안에서 전체 성비대로 남/여를 쪼갠다
function tableCaps(T, M, Wc){
  const N = M + Wc, total = spread(N, T);
  if(N === 0) return { total, capM: total.map(()=>0), capW: total.map(()=>0) };
  const exact = total.map(c => c * M / N);
  const capM  = exact.map(Math.floor);
  let rest = M - capM.reduce((a,b)=>a+b,0);
  const order = exact.map((e,i) => ({ i, frac: e - Math.floor(e), c: total[i] }))
                     .sort((a,b) => b.frac - a.frac || b.c - a.c || a.i - b.i);
  for(const o of order){ if(rest <= 0) break; if(capM[o.i] < total[o.i]){ capM[o.i]++; rest--; } }
  for(let i = 0; rest > 0 && i < T; i++){ while(rest > 0 && capM[i] < total[i]){ capM[i]++; rest--; } }
  return { total, capM, capW: total.map((c,i) => c - capM[i]) };
}

// 이전에 발행된 라운드에서 같이 앉았던 쌍
function pastTogether(ev, upToRound){
  const set = new Set();
  for(const s of ev.seating){
    if(s.round >= upToRound || s.status !== "published") continue;
    const byTable = {};
    for(const [pid,t] of Object.entries(s.seats)) (byTable[t] = byTable[t] || []).push(pid);
    for(const list of Object.values(byTable))
      for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++)
        set.add(list[i] < list[j] ? list[i]+"|"+list[j] : list[j]+"|"+list[i]);
  }
  return set;
}

// 라운드가 진행될수록 "새로운 사람을 만나는 것"의 가중치를 올린다.
// 이성 재회는 소개팅 목적상 더 크게, 동성 재회는 가볍게 벌점을 준다.
function repWeights(round){
  const base = W.REP * (1 + 0.5 * Math.max(0, round - 1));
  const cap = W.AGE * 0.75;                       // 나이 제약을 넘어서지 않도록 상한
  return { x: Math.min(base * 1.6, cap), s: base * 0.35 };   // x: 이성, s: 동성
}
function pairCost(ev, a, b, ctx){
  let c = 0;
  if(Math.abs(a.age - b.age) >= 10) c += W.AGE;
  const k = a.id < b.id ? a.id+"|"+b.id : b.id+"|"+a.id;
  const cross = a.gender !== b.gender;
  const mutual = cross && isMutual(ev, a.id, b.id);
  // 서로 찌른 쌍은 라운드가 바뀌어도 계속 붙여준다 (재회 벌점 면제)
  // 마지막 자리는 '새로운 사람'보다 '마음이 맞은 사람'을 붙이는 게 목적이라 재회 벌점을 아예 뺀다
  if(ctx.past.has(k) && !mutual && !ctx.final) c += cross ? ctx.rep.x : ctx.rep.s;
  if(cross){
    if(mutual) c -= ctx.final ? W.POKE_MUTUAL * 2.5 : W.POKE_MUTUAL;
    else if(pokeCount(ev,a.id,b.id) > 0 || pokeCount(ev,b.id,a.id) > 0) c -= ctx.final ? W.POKE_ONE * 2 : W.POKE_ONE;
  }
  return c;
}
function tableCost(ev, members, ctx){
  let c = 0;
  for(let i=0;i<members.length;i++)
    for(let j=i+1;j<members.length;j++) c += pairCost(ev, members[i], members[j], ctx);
  const I = members.filter(isIntrovert).length;
  c += W.IE * Math.abs(I - (members.length - I));   // I/E가 한쪽으로 쏠릴수록 벌점
  return c;
}
function totalCost(ev, tables, ctx){
  return tables.reduce((s,t) => s + tableCost(ev, t, ctx), 0);
}

function buildSeating(ev, round, final, tableCount, iterations){
  const T = tableCount || ev.tables;
  const men   = ev.players.filter(p => p.gender === "M");
  const women = ev.players.filter(p => p.gender === "F");
  if(!ev.players.length) return null;

  const { capM, capW } = tableCaps(T, men.length, women.length);
  const past = pastTogether(ev, round);
  const ctx = { past, rep: repWeights(round), final: !!final };

  // 초기 배치: 나이순으로 이어서 채운다 → 나이차 제약을 처음부터 크게 만족
  const byAge = (a,b) => a.age - b.age || a.id.localeCompare(b.id);
  const tables = Array.from({length:T}, () => []);
  const deal = (list, cap) => {
    const sorted = list.slice().sort(byAge);
    let k = 0;
    for(let t=0;t<T;t++) for(let c=0;c<cap[t];c++) if(k < sorted.length) tables[t].push(sorted[k++]);
  };
  deal(men, capM);
  deal(women, capW);

  // 지역 탐색: 같은 성별끼리만 교환 → 성비(하드 제약)는 절대 깨지지 않는다
  const flat = [];
  tables.forEach((list,t) => list.forEach(p => flat.push({ p, t })));
  let cost = totalCost(ev, tables, ctx);
  const iters = iterations || Math.max(3000, ev.players.length * 400);

  for(let it=0; it<iters; it++){
    const i = Math.floor(RND()*flat.length), j = Math.floor(RND()*flat.length);
    const A = flat[i], B = flat[j];
    if(!A || !B || A.t === B.t || A.p.gender !== B.p.gender) continue;

    const ta = tables[A.t], tb = tables[B.t];
    const ia = ta.indexOf(A.p), ib = tb.indexOf(B.p);
    const before = tableCost(ev, ta, ctx) + tableCost(ev, tb, ctx);
    ta[ia] = B.p; tb[ib] = A.p;
    const after = tableCost(ev, ta, ctx) + tableCost(ev, tb, ctx);

    if(after <= before){                       // 개선되거나 같으면 수락 (평평한 지형 탈출)
      const tmp = A.t; A.t = B.t; B.t = tmp;
      cost += after - before;
    } else {
      ta[ia] = A.p; tb[ib] = B.p;              // 되돌리기
    }
  }

  const seats = {};
  tables.forEach((list,t) => list.forEach(p => seats[p.id] = t));
  return { round, final: !!final, tables: T, seats, status:"draft", at:Date.now(), metrics: seatMetrics(ev, seats, past, T) };
}

function seatMetrics(ev, seats, past, tables){
  const T = tables || ev.tables;
  const groups = Array.from({length:T}, () => []);
  for(const p of ev.players){ const t = seats[p.id]; if(t !== undefined && groups[t]) groups[t].push(p); }

  let ageBad = 0, repeat = 0, repeatX = 0, crossPairs = 0, pokeMet = 0, pokeTotal = 0, ieOff = 0;
  const sizes = [], gdiff = [];
  for(const g of groups){
    const m = g.filter(p => p.gender === "M").length;
    sizes.push(g.length); gdiff.push(Math.abs(m - (g.length - m)));
    const I = g.filter(isIntrovert).length;
    ieOff += Math.abs(I - (g.length - I));
    for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){
      const a = g[i], b = g[j];
      const cross = a.gender !== b.gender;
      if(cross) crossPairs++;
      if(Math.abs(a.age - b.age) >= 10) ageBad++;
      const k = a.id < b.id ? a.id+"|"+b.id : b.id+"|"+a.id;
      if(past && past.has(k)){ repeat++; if(cross) repeatX++; }
    }
  }
  for(const pk of ev.pokes){
    pokeTotal++;
    if(seats[pk.from] !== undefined && seats[pk.from] === seats[pk.to]) pokeMet++;
  }
  const pairs = mutualPairs(ev);
  const pairMet = pairs.filter(([a,b]) => seats[a.id] !== undefined && seats[a.id] === seats[b.id]).length;

  return {
    sizes, maxGenderDiff: sizes.length ? Math.max(...gdiff) : 0,
    ageBad, repeat, repeatX, crossPairs,
    freshRate: crossPairs ? Math.round((crossPairs - repeatX) / crossPairs * 100) : 100,
    ieOff,
    pokeMet, pokeTotal, pokeRate: pokeTotal ? Math.round(pokeMet/pokeTotal*100) : 0,
    pairMet, pairTotal: pairs.length,
  };
}

function roundLabel(s){ return s ? (s.final ? "🏁 마지막 자리" : `${s.round}라운드`) : ""; }
function seatingOf(ev, round){ return ev.seating.find(s => s.round === round) || null; }
function publishedSeating(ev){
  const pub = ev.seating.filter(s => s.status === "published");
  return pub.length ? pub[pub.length-1] : null;
}
function currentDraft(ev){
  const d = ev.seating.filter(s => s.status === "draft");
  return d.length ? d[d.length-1] : null;
}
function nextRound(ev){
  return ev.seating.length ? Math.max(...ev.seating.map(s => s.round)) + 1 : 1;
}

// 자리 배정이 끝났는지 — '마지막 자리'가 발행되면 더 이상 바꾸지 않는다
function isSeatClosed(ev){ return !!ev && ev.seating.some(s => s.status === "published" && s.final); }
function reopenSeating(){
  const ev = hostEv();
  if(!ev) return;
  ev.seating.forEach(s => { s.final = false; });
  render();
  toast("자리 배정을 다시 열었어요");
}
// 마지막 자리까지 끝난 뒤 지각 참가자가 생겼을 때 — 열고 바로 배정까지
function reopenAndSeat(){
  const ev = hostEv();
  if(!ev) return;
  ev.seating.forEach(s => { s.final = false; });
  makeSeating(false);
}

function makeSeating(final){
  const ev = hostEv();
  if(!ev) return;
  if(!ev.players.length){ toast("참가자가 없어요"); return; }
  if(phaseOf(ev) === "done"){ toast("발표가 끝나 자리를 더 바꾸지 않아요"); return; }
  if(isSeatClosed(ev)){ toast("마지막 자리까지 끝났어요. 다시 열려면 '배정 다시 열기'를 눌러주세요"); return; }

  const draft = currentDraft(ev);
  const round = draft ? draft.round : nextRound(ev);
  const isFinal = final === undefined ? (draft ? !!draft.final : false) : !!final;

  const res = buildSeating(ev, round, isFinal, ev.tables);
  if(!res) return;
  if(draft) Object.assign(draft, res);
  else ev.seating.push(res);
  render();
  toast(isFinal
    ? `🏁 마지막 자리(${round}라운드) 초안 생성 — 검토 후 알림을 보내세요`
    : `${round}라운드 자리 초안 생성 — 검토 후 알림을 보내세요`);
}
function reshuffleDraft(){ makeSeating(); }
// 테이블 수는 자리 배정 시점에 고른다. 초안이 있으면 즉시 다시 배정.
function setTables(n){
  const ev = hostEv();
  if(!ev || isSeatClosed(ev)) return;
  ev.tables = n;
  const d = currentDraft(ev);
  if(d) makeSeating(d.final);
  else render();
}
// 초안 상태에서 일반 ↔ 마지막 전환
function toggleFinalDraft(){
  const ev = hostEv(), d = currentDraft(ev);
  if(!ev || !d) return;
  makeSeating(!d.final);
}

function moveSeat(pid, t){
  const ev = hostEv(), d = currentDraft(ev);
  if(!ev || !d) return;
  d.seats[pid] = Number(t);
  d.metrics = seatMetrics(ev, d.seats, pastTogether(ev, d.round), d.tables);
  render();
}
/* 자리가 새로 발행되면 참가자에게 전체 화면으로 알리고 '이동했어요' 확인을 받는다 */
function needSeatAck(ev, playerId){
  if(!ev || isRevealed(ev)) return null;   // 파티가 끝났는데 '자리로 이동하세요'는 맞지 않는다
  const pub = publishedSeating(ev);
  if(!pub || !playerId) return null;
  if(pub.seats[playerId] === undefined) return null;
  if(pub.acks && pub.acks[playerId]) return null;
  return pub;
}
function ackSeat(pane){
  const c = vctx(pane);
  const pub = publishedSeating(c.ev);
  if(!pub || !c.m) return;
  pub.acks = pub.acks || {};
  pub.acks[c.m.id] = Date.now();
  render();
  toast("자리 이동을 확인했어요 👍");
}
// 성비가 얼마나 치우쳤는지 — 등록 단계에서 미리 알아야 대응할 수 있다
function genderBalance(ev){
  const M = ev.players.filter(p => p.gender === "M").length;
  const W = ev.players.length - M;
  if(!ev.players.length) return null;
  if(!M || !W) return { M, W, level:"bad", msg:`${M ? "남성" : "여성"}만 ${M||W}명이에요. 이성이 없으면 콕도 자리 배정도 되지 않아요.` };
  const hi = Math.max(M,W), lo = Math.min(M,W);
  const ratio = hi / lo;
  if(ratio >= 2)   return { M, W, level:"bad",  msg:`성비가 ${M}:${W}로 크게 치우쳤어요. 자리를 나누면 테이블마다 한쪽이 몰립니다.` };
  if(ratio >= 1.5) return { M, W, level:"warn", msg:`성비가 ${M}:${W}예요. 한쪽이 조금 많습니다.` };
  return { M, W, level:"ok", msg:`성비 ${M}:${W} — 균형이 좋아요.` };
}
// 이번 라운드에 아직 한 번도 안 찌른 사람 (독려 대상)
function notPokedYet(ev){
  const ph = pokePhase(ev);
  return ev.players.filter(p => sentCount(ev, p.id, ph) === 0);
}
// 발행/초안 자리에 포함되지 않은 참가자 (자리 배정 뒤에 들어온 지각 참가자 등)
function unseatedPlayers(ev, seating){
  if(!seating) return [];
  return ev.players.filter(p => seating.seats[p.id] === undefined);
}

/* 운영자가 단계를 옮기면 참가자 화면이 말없이 바뀌던 문제.
   fired 기록을 참가자용 안내 문구로 바꿔 알림 탭과 배너에 보여준다. */
function phaseNotices(ev){
  if(!ev) return [];
  const f = ev.fired || {}, ph = phaseOf(ev), out = [];
  if(f.prevote) out.push({ ic:"🗳️", t:"사전 투표가 시작됐어요",
                           s:`1인당 ${ev.maxPre}회씩 콕을 찌를 수 있어요`, at:f.prevote });
  if(f.party)   out.push({ ic:"🎉", t:"사전 투표가 마감됐어요",
                           s:`파티 라운드 콕 ${ev.maxParty}회를 새로 받았어요`, at:f.party });
  if(f.done && ph === "done")
    out.push({ ic:"🎊", t:"결과가 발표됐어요", s:"서로 찌른 상대를 확인해보세요", at:f.done });
  if(f.done && ph !== "done")
    out.push({ ic:"↩︎", t:"운영자가 발표를 되돌렸어요",
               s:"결과가 잠시 감춰졌어요. 곧 다시 발표될 수 있어요", at:f.done, warn:true });
  return out.sort((a,b) => b.at - a.at);
}
function latestNotice(ev){
  const n = phaseNotices(ev)[0];
  return n && Date.now() - n.at < 3*60000 ? n : null;   // 최근 3분 안의 변화만 배너로
}

function ackStats(ev){
  const pub = publishedSeating(ev);
  if(!pub) return null;
  const seated = ev.players.filter(p => pub.seats[p.id] !== undefined);
  const done = seated.filter(p => pub.acks && pub.acks[p.id]);
  return { pub, total: seated.length, done: done.length,
           pending: seated.filter(p => !(pub.acks && pub.acks[p.id])) };
}

function publishSeating(){
  const ev = hostEv(), d = currentDraft(ev);
  if(!ev || !d) return;
  d.status = "published";
  d.at = Date.now();
  d.acks = {};
  render();
  toast(d.final
    ? `🏁 마지막 자리를 참가자 전원에게 알렸어요`
    : `${d.round}라운드 자리를 참가자 전원에게 알렸어요 📣`);
}
function discardDraft(){
  const ev = hostEv();
  if(!ev) return;
  ev.seating = ev.seating.filter(s => s.status !== "draft");
  render();
  toast("초안을 삭제했어요");
}

function openHostPin(target){

   화면 전환 / 등록

function go(screen){ S.screen = screen; S.sheet = null; S.confirm = null; S.hostSheet = null; S.hostConfirm = null; render(); }
function goHostTab(t){ S.hostTab = t; S.hostSheet = null; S.hostConfirm = null; render(); }

function enterByCode(){

// 단계별로 폼이 나뉘므로 '화면에 있는 칸만' 읽어 draft에 보존한다
function syncDraft(){
  const g = (id) => { const el = $("#"+id); return el ? el.value : null; };
  const set = (k, id) => { const v = g(id); if(v !== null) S.draft[k] = v; };
  set("nick","f-nick"); set("name","f-name"); set("age","f-age");
  set("phone","f-phone"); set("insta","f-insta");
  [0,1,2].forEach(i => { const v = g("f-charm"+i); if(v !== null) S.draft.charms[i] = v; });
}
function draftMbti(){
  const a = S.draft.axes;
  return a.every(Boolean) ? a.join("") : "";
}
function charmCount(i){
  const el = $("#f-charm"+i), out = $("#charm-cnt"+i);
  if(!el || !out) return;
  S.draft.charms[i] = el.value;
  out.textContent = `${el.value.length}/30`;

}
function pickAxis(i, letter){

  S.draft.axes[i] = letter;
  document.querySelectorAll(`[data-axis="${i}"]`).forEach(b =>
    b.classList.toggle("on", b.dataset.letter === letter));

  if(out) out.textContent = draftMbti() || "· · · ·";
}
function pickGender(g){

  document.querySelectorAll(".choice button").forEach(b => b.classList.toggle("on", b.dataset.g === g));
}
function pickMbti(m){   // 테스트·프로그램 호출용 (화면에서는 4문항 토글을 씁니다)
  syncDraft();
  S.draft.axes = String(m).toUpperCase().split("");
  render();
}
function showFieldError(msg, fieldId, select){
  document.querySelectorAll(".input.bad, .input-at.bad").forEach(e => e.classList.remove("bad"));
  document.querySelectorAll(".field-err").forEach(e => e.remove());
  if($("#f-err")) $("#f-err").textContent = fieldId ? "" : msg;
  const el = fieldId && $("#"+fieldId);
  if(!el){ if($("#f-err")) $("#f-err").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const box = el.closest(".input-at") || el;
  box.classList.add("bad");
  const tip = document.createElement("div");
  tip.className = "field-err"; tip.textContent = msg;
  (box.closest(".charm-row") || box).parentNode.appendChild(tip);
  box.scrollIntoView({behavior:"smooth",block:"center"});
  el.focus();
  if(select && el.select) el.select();
}

// 단계별 검증 — 통과하면 "" 를 돌려준다
function regValidate(step){
  const d = S.draft;
  if(step === 1){
    if(!d.nick.trim()) return ["닉네임을 입력해주세요.", "f-nick"];
    if(!d.name.trim()) return ["이름(실명)을 입력해주세요.", "f-name"];
    const age = parseInt(d.age, 10);
    if(!(age >= 18 && age <= 99)) return ["나이는 18~99 사이로 입력해주세요.", "f-age"];
    if(!d.gender) return ["성별을 선택해주세요.", ""];
  }
  if(step === 2){
    const digits = d.phone.replace(/\D/g,"");
    if(digits.length < 10 || digits.length > 11) return ["전화번호를 정확히 입력해주세요.", "f-phone"];
    const insta = normInsta(d.insta);
    if(insta && !/^[A-Za-z0-9._]{1,30}$/.test(insta))
      return ["인스타 아이디는 영문·숫자·마침표·밑줄만 쓸 수 있어요.", "f-insta"];
  }
  if(step === 3){
    if(!draftMbti()) return ["네 가지 질문에 모두 답해주세요.", ""];
    const empty = d.charms.findIndex(c => !c.trim());
    if(empty >= 0) return [`매력 ${empty+1}번을 채워주세요. 세 가지 모두 필요해요.`, "f-charm"+empty];
  }
  return null;
}
function regStep(n){
  syncDraft();
  if(n > S.regStep){
    const e = regValidate(S.regStep);
    if(e){ showFieldError(e[0], e[1]); return; }
  }
  S.regStep = Math.max(1, Math.min(3, n));
  render();
}

function submitRegister(){
  const ev = curEv();
  if(!ev) return;
  const gate = canRegister(ev);
  if(!gate.ok){ showFieldError(gate.why, ""); return; }

  syncDraft();
  const d = S.draft;
  for(const st of [1,2,3]){
    const e = regValidate(st);
    if(e){ S.regStep = st; render(); showFieldError(e[0], e[1]); return; }
  }
  const nick = d.nick.trim(), name = d.name.trim();
  const age = parseInt(d.age, 10);
  const phone = d.phone.trim(), insta = normInsta(d.insta);
  const charms = d.charms.map(c => c.trim());
  const digits = phone.replace(/\D/g,"");

  // 같은 번호면 이 회차의 기존 참가자로 재접속
  const dup = ev.players.find(p => p.phone.replace(/\D/g,"") === digits);
  if(dup){
    if(S.regFromDemo){
      S.regFromDemo = false;
      let slot = S.panes.findIndex((x, i) => i < S.paneCount && !x.meId);
      if(slot < 0) slot = 0;
      S.panes[slot].evId = ev.id; S.panes[slot].meId = dup.id;
      S.demoEvId = ev.id; S.screen = "demo"; render();
      toast(`${dn(dup)}님을 ${slot+1}번 화면에 띄웠어요`);
      return;
    }
    S.meId = dup.id; go("main"); toast(`${dn(dup)}님, 다시 오셨네요 👋`); return;
  }

  // 닉네임은 회차 안에서 유일해야 한다
  const taken = ev.players.find(p => nickKey(p.nick) === nickKey(nick));
  if(taken){
    S.regStep = 1;                 // 닉네임 칸이 있는 단계로 돌려보내야 고칠 수 있다
    render();
    showFieldError(`'${nick}'은(는) 이 회차에서 이미 사용 중이에요. 다른 닉네임을 골라주세요.`, "f-nick", true);
    return;
  }

  const p = { id:"p"+(ev.pseq++), nick, name, age, gender:d.gender, phone, insta, mbti:draftMbti(), charms };
  ev.players.push(p);
  S.meId = p.id;
  S.draft = emptyDraft();
  S.regStep = 1;
  S.tab = "people";

  if(S.regFromDemo){
    S.regFromDemo = false;
    S.demoEvId = ev.id;
    S.panes.forEach(st => { if(!st.evId) st.evId = ev.id; });
    // 비어 있는 화면이 있으면 거기에, 없으면 첫 번째 화면에 띄운다
    let slot = S.panes.findIndex((x, i) => i < S.paneCount && !x.meId);
    if(slot < 0) slot = 0;
    S.panes[slot].evId = ev.id;
    S.panes[slot].meId = p.id;
    S.panes[slot].sheet = null;
    S.panes[slot].confirm = null;
    S.screen = "demo";
    render();
    toast(`${nick}님 등록 완료 — ${slot+1}번 화면에 띄웠어요 🎉`);
    return;
  }

  go("main");
  toast(`${nick}님 입장 완료! 🎉`);
}

/* ══════════════════════════════════════════════════════════
   운영자 설정 조작
   ══════════════════════════════════════════════════════════ */
function evSet(key, val){ const ev = hostEv(); if(!ev) return; ev[key] = val; render(); }
const clampPoke = (k, key) => Math.max(1, Math.min(key === "maxPre" ? 5 : 10, k));
function warnLowerBudget(ev, phase, k){
  const over = ev.players.filter(p => sentCount(ev, p.id, phase) > k);
  if(over.length) toast(`이미 ${k}회를 넘게 쓴 참가자 ${over.length}명이 있어요. 그분들은 더 찌를 수 없습니다`);
}
function evPre(k){
  const ev = hostEv(); const v = clampPoke(k, "maxPre");
  if(ev && v < ev.maxPre) warnLowerBudget(ev, "pre", v);
  evSet("maxPre", v);
}
function evParty(k){
  const ev = hostEv(); const v = clampPoke(k, "maxParty");
  if(ev && v < ev.maxParty) warnLowerBudget(ev, "party", v);
  evSet("maxParty", v);
}
function defPre(k){ DB.defaults.maxPre = clampPoke(k, "maxPre"); render(); }
function defParty(k){ DB.defaults.maxParty = clampPoke(k, "maxParty"); render(); }
function wizPre(k){ wizSync(); S.wizard.maxPre = clampPoke(k, "maxPre"); render(); }
function wizParty(k){ wizSync(); S.wizard.maxParty = clampPoke(k, "maxParty"); render(); }
function evSetNum(key, val){ evSet(key, Number(val)); }
function evSetTime(key, val){
  const ev = hostEv(); if(!ev) return;
  phaseOf(ev);
  if(schedLocked(ev, key)){ toast("이미 지나온 단계의 시각은 바꿀 수 없어요"); render(); return; }

  const next = fromLocalInput(val);
  const f = ev.fired || {};
  // 순서가 뒤집히면 시작하자마자 끝나버리므로 막는다 (위저드에는 있던 검증이 설정 탭엔 없었다)
  if(key === "voteCloseAt" && next && ev.regOpenAt && next <= ev.regOpenAt){
    toast("사전 투표 마감은 등록 시작보다 뒤여야 해요"); render(); return;
  }
  if(key === "revealAt" && next && !f.party && ev.voteCloseAt && next <= ev.voteCloseAt){
    toast("발표는 사전 투표 마감보다 뒤여야 해요"); render(); return;
  }
  if(key === "regOpenAt" && next && ev.voteCloseAt && next >= ev.voteCloseAt){
    toast("등록 시작은 사전 투표 마감보다 앞이어야 해요"); render(); return;
  }
  ev[key] = next;
  render();
  toast("일정을 바꿨어요");
}

/* 단계 변경은 항상 이 함수를 거친다.
   실제로 진행된 시각을 fired 에 남기고, 예약 시각은 건드리지 않는다.
   (예전에는 지나간 시각을 몰래 지우거나 30분씩 밀어서 운영자가 안내한 시각이 바뀌었다) */
function setPhase(ev, ph){
  ev.fired = ev.fired || {};
  ev.phase = ph;
  if(ph !== "prep" && !ev.fired[ph]) ev.fired[ph] = Date.now();
  ev.revealed = (ph === "done");
}

// 단계 전환은 되돌리기 어려운 동작이라 항상 확인을 받는다
function askAdvancePhase(){
  const ev = hostEv(); if(!ev) return;
  const i = PHASE_ORDER.indexOf(phaseOf(ev));
  if(i >= PHASE_ORDER.length - 1) return;
  S.hostConfirm = { type:"phase", to: PHASE_ORDER[i+1] };
  render();
}
function askUnreveal(){
  const ev = hostEv(); if(!ev || phaseOf(ev) !== "done") return;
  S.hostConfirm = { type:"unreveal" };
  render();
}
function advancePhase(){
  const ev = hostEv(); if(!ev) return;
  const i = PHASE_ORDER.indexOf(phaseOf(ev));
  if(i >= PHASE_ORDER.length - 1) return;
  const next = PHASE_ORDER[i+1];
  setPhase(ev, next);
  render();
  toast(`${PHASES[next].label} 단계로 넘어갔어요`);
}
function unrevealPhaseOn(ev){ if(ev) setPhase(ev, "party"); }
function unrevealPhase(){
  const ev = hostEv(); if(!ev) return;
  setPhase(ev, "party");
  render();
  toast("발표를 취소했어요 — 참가자 화면에서 결과가 다시 숨겨집니다");
}
function openPlayerSheet(id, e){ if(e) e.stopPropagation(); S.hostSheet = id; render(); }
function closePlayerSheet(){ S.hostSheet = null; render(); }

function askRemovePlayer(id, e){

function cancelHostConfirm(){ S.hostConfirm = null; render(); }
function confirmHostAction(){
  const c = S.hostConfirm;
  S.hostConfirm = null;
  if(!c) { render(); return; }
  if(c.type === "phase"){ advancePhase(); return; }
  if(c.type === "delEvent"){
    const ev = EV(c.id), nm = ev ? ev.name : "";
    deleteEvent(c.id);
    toast(`${nm} 회차를 삭제했어요`);
    return;
  }
  if(c.type === "unreveal"){ unrevealPhase(); return; }
  if(c.type === "delPlayer"){
    const ev = hostEv(), p = P(ev, c.id);
    const nm = p ? dn(p) : "";
    S.hostSheet = null;
    removePlayer(c.id);
    toast(`${nm}님을 삭제했어요`);
  } else render();
}

function removePlayer(id){
  const ev = hostEv(); if(!ev) return;
  const gone = P(ev, id);
  ev.players = ev.players.filter(p => p.id !== id);
  ev.pokes = ev.pokes.filter(p => p.from !== id && p.to !== id);
  ev.seating.forEach(s => { delete s.seats[id]; s.metrics = seatMetrics(ev, s.seats, pastTogether(ev, s.round), s.tables); });
  S.panes.forEach(st => { if(st.meId === id){ st.meId = null; st.sheet = null; st.confirm = null; } });
  if(S.meId === id){
    // 참가자 화면이 이유 없이 입장 화면으로 튕기던 문제 — 무슨 일이 있었는지 남긴다
    S.meId = null;
    S.entryErr = `${ev.name} — 운영자가 ${gone ? dn(gone) + "님의 " : ""}참가를 취소했어요. 문의는 파티 운영자에게 해주세요.`;
    if(S.screen === "main") S.screen = "entry";
  }
  render();
}
function askDeleteEvent(id){ S.hostConfirm = { type:"delEvent", id }; render(); }
function deleteEvent(id){
  const gone = EV(id);
  const wasMine = S.evId === id;
  DB.events = DB.events.filter(e => e.id !== id);
  if(S.hostEvId === id) S.hostEvId = null;
  if(S.demoEvId === id) S.demoEvId = null;
  S.panes.forEach(st => { if(st.evId === id){ st.evId = null; st.meId = null; st.sheet = null; st.confirm = null; } });
  if(wasMine){
    S.evId = null; S.meId = null;
    S.entryErr = `${gone ? gone.name + " — " : ""}운영자가 이 회차를 종료하고 삭제했어요.`;
  }
  // 참가자였다면 운영자 화면이 아니라 입장 화면으로 보낸다
  S.screen = S.auth ? "hostEvents" : "entry";
  render();
}
/* ── 회차 생성 위저드 (기본정보 → 일정 → 규칙 → 확인) ── */
function openWizard(){
  const now = Date.now(), D = DB.defaults;
  const reg = now + D.regOpenAfterH * 3600000;
  const startNow = D.regOpenAfterH === 0;      // 기본이 '바로'면 위저드도 즉시 시작으로 연다
  let pin = String(1000 + Math.floor(RND()*9000));
  while(pin === DB.masterPin) pin = String(1000 + Math.floor(RND()*9000));
  S.wizard = {
    step: 1,
    name: `${DB.events.length + 1}회차 솔로 파티`,
    pin,
    code: genCode(),
    regNow: startNow,
    regKeep: startNow ? now + 3600000 : reg,   // '시각 지정'으로 되돌릴 때 쓸 값
    regOpenAt: startNow ? now : reg,
    voteCloseAt: reg + D.voteWindowH * 3600000,
    maxPre: D.maxPre,
    maxParty: D.maxParty,
    err: "",
  };
  S.screen = "wizard";
  render();
}
function wizSync(){
  const w = S.wizard; if(!w) return;
  const g = (id) => { const el = $("#"+id); return el ? el.value : null; };
  const nm = g("w-name"); if(nm !== null) w.name = nm;
  const pin = g("w-pin"); if(pin !== null) w.pin = pin;
  const cd = g("w-code"); if(cd !== null) w.code = cd.toUpperCase().replace(/[^A-Z0-9]/g,"");
  const r = g("w-reg"); if(r !== null && !w.regNow){ const t = fromLocalInput(r); if(t) w.regOpenAt = t; }
  const v = g("w-vote"); if(v !== null){ const t = fromLocalInput(v); if(t) w.voteCloseAt = t; }
}
function wizSet(k, v){ if(!S.wizard) return; wizSync(); S.wizard[k] = v; S.wizard.err = ""; render(); }
function wizRegNow(on){
  if(!S.wizard) return;
  wizSync();
  const w = S.wizard;
  if(on){
    if(!w.regNow) w.regKeep = w.regOpenAt;          // 되돌릴 때 쓰려고 보관
    w.regNow = true;
    w.regOpenAt = Date.now();
    if(w.voteCloseAt <= w.regOpenAt) w.voteCloseAt = w.regOpenAt + DB.defaults.voteWindowH * 3600000;
  } else {
    w.regNow = false;
    // '지금 바로'로 덮어쓴 과거 시각이 남아 예약한 줄 알고 만들던 문제
    w.regOpenAt = (w.regKeep && w.regKeep > Date.now()) ? w.regKeep : Date.now() + 3600000;
    if(w.voteCloseAt <= w.regOpenAt) w.voteCloseAt = w.regOpenAt + DB.defaults.voteWindowH * 3600000;
  }
  w.err = "";
  render();
}
function wizStep(n){
  if(!S.wizard) return;
  wizSync();
  const w = S.wizard;
  if(n > w.step){
    const e = wizValidate(w.step);
    if(e){ w.err = e; render(); return; }
  }
  w.err = "";
  w.step = Math.max(1, Math.min(4, n));
  render();
}
function wizValidate(step){
  const w = S.wizard;
  if(!w) return "";
  if(step === 1){
    if(!w.name.trim()) return "회차 이름을 입력해주세요.";
    if(!/^\d{4}$/.test(w.pin)) return "운영자 PIN은 숫자 4자리여야 해요.";
    if(w.pin === DB.masterPin) return `공통 운영자 PIN(${DB.masterPin})과 다른 번호를 써주세요.`;
    if(!/^[A-Z0-9]{4,8}$/.test(w.code)) return "입장 코드는 영문 대문자·숫자 4~8자예요.";
    const dup = DB.events.find(e => e.code === w.code);
    if(dup) return `입장 코드 ${w.code}는 '${dup.name}'에서 쓰고 있어요.`;
  }
  if(step === 2){
    if(!w.regOpenAt) return "등록 시작 시각을 정해주세요.";
    if(!w.voteCloseAt) return "사전 투표 마감 시각을 정해주세요.";
    if(w.voteCloseAt <= w.regOpenAt) return "사전 투표 마감은 등록 시작보다 뒤여야 해요.";
  }
  return "";
}
function wizCreate(){
  if(!S.wizard) return;          // 더블클릭으로 두 번 들어오면 두 번째는 무시
  wizSync();
  const w = S.wizard;
  for(const st of [1,2,3]){
    const e = wizValidate(st);
    if(e){ w.err = e; w.step = st; render(); return; }
  }
  const ev = newEvent(w.name.trim(), w.pin, {
    code: w.code,
    regOpenAt: w.regNow ? Date.now() : w.regOpenAt,
    voteCloseAt: w.voteCloseAt,
    maxPre: w.maxPre,
    maxParty: w.maxParty,
  });
  // 예약이든 즉시든 phaseOf()가 시각을 보고 알아서 등록을 엽니다
  phaseOf(ev);
  S.wizard = null;
  S.hostEvId = ev.id;
  S.screen = "hostConsole";
  S.hostTab = "dash";
  render();
  toast(w.regNow
    ? `${ev.name} 생성 — 지금부터 등록 가능 · 입장 코드 ${ev.code}`
    : `${ev.name} 생성 — ${fmtDT(ev.regOpenAt)}부터 등록 · 입장 코드 ${ev.code}`);
}

  if(S.screen === "hostConsole" && !hostEv()) S.screen = S.auth ? "hostEvents" : "entry";
  if(["hostEvents","hostDefaults","wizard"].includes(S.screen) && S.auth !== "master") S.screen = S.auth ? "hostConsole" : "entry";
  r.innerHTML = (V[S.screen] || viewEntry)();
  if(S.screen === "main"){
    const c = vctx(-1);
    r.innerHTML += S.sheet ? viewSheet(c) : "";
    r.innerHTML += S.confirm ? viewConfirm(c) : "";
    r.innerHTML += viewSeatAck(c);
  }
  r.innerHTML += (S.hostSheet && S.screen === "hostConsole") ? viewPlayerSheet(S.hostSheet) : "";
  r.innerHTML += S.hostConfirm ? viewHostConfirm(S.hostConfirm) : "";
  renderProtoBar();
}

function renderProtoBar(){
  const evSel = $("#ev-switch");
  evSel.innerHTML = DB.events.length
    ? DB.events.map(e => `<option value="${e.id}" ${e.id===S.evId?"selected":""}>${esc(e.name)}</option>`).join("")
    : `<option value="">회차 없음</option>`;

  // 데모 화면에서는 폰마다 참가자 선택기가 따로 있으므로 이 스위처는 숨긴다
  const inDemo = S.screen === "demo";
  const ev = inDemo ? EV(S.demoEvId) : (curEv() || protoTargetEv());
  const sel = $("#switcher");
  sel.style.display = inDemo ? "none" : "";
  sel.innerHTML = ev && ev.players.length
    ? ev.players.map(p => `<option value="${p.id}" ${p.id===S.meId?"selected":""}>${esc(dn(p))} (${p.gender==="M"?"남":"여"}·${p.age})</option>`).join("")
    : `<option value="">참가자 없음</option>`;
  if(S.meId) sel.value = S.meId;

  const addBtn = $("#add-participant");
  const target = protoTargetEv();
  addBtn.disabled = !target;
  addBtn.title = target ? `${target.name}에 참가자 추가` : "회차가 없습니다";
}

function hostDash(ev){
  const ph = phaseOf(ev);
  const i = PHASE_ORDER.indexOf(ph);
  const pairs = mutualPairs(ev);
  const topM = preTop(ev, "M"), topF = preTop(ev, "F");
  const ranking = ev.players.map(p => ({ p, n: gotPokes(ev, p.id).length }))
    .sort((a,b) => b.n - a.n || dn(a.p).localeCompare(dn(b.p))).slice(0,8);
  const max = Math.max(1, ...ranking.map(r => r.n));

  return `
    <div class="note bad" style="margin-bottom:14px">

// 각자 이성 k명을 고른다고 보면 상호 매칭 기대 쌍수는 k² (시뮬레이션으로 확인)
function pokeEstimate(M, W, k){
  if(!M || !W) return null;
  const pairs = M * W;
  const exp = Math.min(pairs, k * k);
  const pct = exp / pairs * 100;
  let label, color;
  if(pct < 3)        { label = "매칭이 드물게 나올 수 있어요"; color = "var(--blue)"; }
  else if(pct <= 15) { label = "적당해요";                     color = "var(--mint)"; }
  else               { label = "매칭이 흔해져 특별함이 줄어요"; color = "var(--gold)"; }
  return { pairs, exp, pct: Math.round(pct), label, color, total: (M + W) * k };
}

// 칩 나열 대신 스테퍼 + 점 트랙 + '이 숫자가 뭘 뜻하는지' 미리보기
function pokeStepper(o){
  const est = pokeEstimate(o.M, o.W, o.k);
  const dots = Array.from({length:o.max}, (_,i) => {
    const n = i + 1;
    return `<button class="dot ${n<=o.k?"on":""}" onclick="${o.setter}(${n})" title="${n}회"></button>`;
  }).join("");
  return `
  <div class="pk-box">
    <div class="pk-top">
      <span>${o.title}</span>
      <b>${o.k}<em>회</em></b>
    </div>
    <div class="pk-row">
      <button class="pk-btn" ${o.k<=o.min?"disabled":""} onclick="${o.setter}(${o.k-1})">−</button>
      <div class="pk-dots">${dots}</div>
      <button class="pk-btn" ${o.k>=o.max?"disabled":""} onclick="${o.setter}(${o.k+1})">+</button>
    </div>
    ${est ? `
      <div class="pk-est">
        참가자 ${o.M+o.W}명(남 ${o.M}·여 ${o.W}) → 최대 <b>${est.total}번</b>의 콕<br>
        이성 조합 ${est.pairs}쌍 중 <b>약 ${est.exp}쌍</b>이 서로 찌를 것으로 예상
        <span style="color:${est.color};font-weight:800"> · ${est.label}</span>
        ${o.second ? `<br><span style="opacity:.75">사전 투표에서 이미 찌른 상대와 겹치는 경우가 많아 <b>실제 새 매칭은 이보다 적습니다.</b></span>` : ""}
      </div>` : `
      <div class="pk-est">참가자가 등록되면 예상 매칭 수를 함께 보여드려요.</div>`}
  </div>`;
}
