    <div class="tbl">
      <div class="tbl-head">
        <div class="t"><span class="dot" style="background:${TBL_COLORS[t%TBL_COLORS.length]}"></span>${t+1}번 테이블</div>
        <div class="mix">
          ${list.length}명 · <b>남 ${m}</b>/<i>여 ${w}</i><br>
          I ${I}·E ${list.length-I}${bad ? ` · <span class="bad">나이차 ${bad}쌍</span>` : ""}
        </div>
      </div>
      ${list.length === 0 ? `<div class="tiny muted" style="padding:6px 0">빈 테이블</div>` : list.map(p => seatRow(p, editable, seats)).join("")}
    </div>`;
  }).join("");

  return `
    <div class="sect">
      <div class="sect-head">
        <h2>자리 배정</h2>
        <span class="tiny muted">${done}라운드 발행${closed ? " · 종료" : ""}</span>
      </div>
      <div class="note" style="margin-bottom:12px">
        <b>성비를 최우선</b>으로 맞춘 뒤, 10살 이상 차이나는 사람과 같은 테이블이 되지 않도록,
        I·E가 섞이도록, 이전 라운드와 다른 사람을 만나도록, 콕으로 이어진 사람은 같이 앉도록 조정합니다.
      </div>
      ${revealedEv ? `<div class="note ok" style="margin-bottom:12px">
        🎊 발표가 끝나 자리를 더 바꾸지 않습니다. 지금 배정해도 <b>참가자에게 알림이 가지 않아요.</b>
      </div>` : ""}
      ${closed || revealedEv ? "" : `
        <div class="tiny muted" style="margin-bottom:7px">
          이번 배정에 쓸 <b>테이블 수</b>${draft ? " — 바꾸면 초안이 다시 만들어집니다" : ""}
        </div>
        <div class="chips" style="margin-bottom:8px">
          ${[2,3,4,5,6,7,8,10,12].map(n => `<button class="chip ${pick===n?"on":""}" onclick="setTables(${n})">${n}개</button>`).join("")}
        </div>
        <div class="tiny muted" style="margin-bottom:12px">
          참가자 ${ev.players.length}명 → 테이블당 약 ${(ev.players.length/pick).toFixed(1)}명
          ${ev.players.length < pick * 2 ? ` · <span style="color:#ffd88a">⚠️ 테이블이 너무 많아요</span>` : ""}
          ${ev.players.length >= pick * 2 && ev.players.length / pick > 8 ? ` · <span style="color:#ffd88a">⚠️ 한 테이블이 너무 커서 새로 만날 사람이 줄어요</span>` : ""}
        </div>`}

      ${revealedEv ? "" :
      closed ? `
        <div class="note ok" style="margin-bottom:10px">
          🏁 <b>마지막 자리까지 발행 완료</b> — 더 이상 자리를 바꾸지 않습니다.
        </div>
        <button class="btn btn-ghost" onclick="reopenSeating()">배정 다시 열기</button>` :
      !draft ? `
        <button class="btn btn-primary" style="margin-bottom:9px" ${ev.players.length?"":"disabled"} onclick="makeSeating(false)">
          🪑 ${nextRound(ev)}라운드 자리 배정하기
        </button>
        <button class="btn btn-gold" ${ev.players.length?"":"disabled"} onclick="makeSeating(true)">🏁 마지막 자리 배정하기</button>
        ${ev.players.length ? "" : `<div class="tiny muted" style="margin-top:9px">참가자가 등록되면 배정할 수 있어요.</div>`}
        <div class="tiny muted" style="margin-top:9px;line-height:1.6">
          횟수 제한은 없어요 — 필요할 때마다 배정하세요.<br>
          <b>마지막 자리</b>는 새로운 사람보다 <b>서로 콕을 주고받은 사람</b>을 같은 테이블에 모읍니다.
        </div>` : `
        <div class="note ${draft.final ? "ok" : "warn"}" style="margin-bottom:10px">
          ${draft.final ? "🏁" : "📝"} <b>${draft.final ? "마지막 자리" : draft.round + "라운드"} 초안</b>
          — 아직 참가자에게 보이지 않습니다. 아래에서 직접 옮긴 뒤 알림을 보내세요.
        </div>
        <div class="btn-row" style="margin-bottom:9px">
          <button class="btn btn-ghost" onclick="reshuffleDraft()">🔀 다시 배정</button>
          <button class="btn btn-ghost" onclick="discardDraft()">초안 삭제</button>
        </div>
        <button class="btn btn-ghost" style="margin-bottom:9px" onclick="toggleFinalDraft()">
          ${draft.final ? "↩︎ 일반 라운드로 되돌리기" : "🏁 이번을 마지막 자리로"}
        </button>
        <button class="btn btn-gold" onclick="publishSeating()">
          📣 ${draft.final ? "마지막 자리 알림 보내기" : "참가자에게 자리 알림 보내기"}
        </button>`}
    </div>

    ${(() => {
      if(!view) return "";
      const left = unseatedPlayers(ev, view);
      if(!left.length) return "";
      return `
      <div class="note bad" style="margin-bottom:${closed && !draft ? "9" : "12"}px">
        🚨 <b>자리가 없는 참가자 ${left.length}명</b> — ${left.map(p => esc(dn(p))+`(${p.gender==="M"?"남":"여"})`).join(", ")}<br>
        ${draft
          ? `<b>🔀 다시 배정</b>을 누르면 이 인원까지 포함해 다시 짭니다.`
          : closed
            ? `마지막 자리까지 끝난 뒤에 등록한 분들이에요. 아래에서 배정을 재개할 수 있습니다.`
            : `자리를 발행한 뒤에 등록한 분들이에요. <b>${nextRound(ev)}라운드 자리 배정</b>을 하면 함께 배치됩니다.`}
      </div>
      ${closed && !draft ? `<button class="btn btn-primary" style="margin-bottom:12px" onclick="reopenAndSeat()">🔓 자리를 다시 열고 ${nextRound(ev)}라운드 배정하기</button>` : ""}`;
    })()}

    ${!view ? `<div class="empty"><div class="ico">🪑</div><p>아직 배정된 자리가 없어요.</p></div>` : `
      <div class="stat-grid">
        <div class="stat"><div class="v" style="color:${mt.maxGenderDiff<=1?"var(--mint)":"#ff8fa8"}">${mt.maxGenderDiff}</div><div class="k">남녀 편차</div></div>
        <div class="stat"><div class="v" style="color:${mt.ageBad===0?"var(--mint)":"var(--gold)"}">${mt.ageBad}</div><div class="k">나이차 쌍</div></div>
        ${view.final
          ? `<div class="stat"><div class="v" style="color:var(--muted);font-size:17px">해당 없음</div><div class="k">새 이성 만남</div></div>`
          : `<div class="stat"><div class="v" style="color:${mt.freshRate>=70?"var(--mint)":"var(--gold)"}">${mt.freshRate}<span style="font-size:13px">%</span></div><div class="k">새 이성 만남</div></div>`}
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${mt.pokeRate}<span style="font-size:13px">%</span></div><div class="k">콕 반영률</div></div>
        <div class="stat"><div class="v" style="color:var(--pink)">${mt.pairMet}<span style="font-size:12px;color:var(--muted)">/${mt.pairTotal}</span></div><div class="k">매칭 동석</div></div>
        <div class="stat"><div class="v" style="color:${mt.ieOff<=2?"var(--mint)":"var(--gold)"}">${mt.ieOff}</div><div class="k">I·E 쏠림</div></div>
      </div>
      <div class="tiny muted" style="margin-bottom:9px">
        ${draft ? `${roundLabel(draft)} 초안 · 테이블 ${T}개` : `${roundLabel(pub)} · 테이블 ${T}개 (발행됨 · ${fmtDT(pub.at)})`}
      </div>
      ${!draft && ack ? `
        <div class="note ${ack.done === ack.total ? "ok" : "warn"}" style="margin-bottom:10px">
          🚶 <b>이동 확인 ${ack.done}/${ack.total}명</b>
          ${ack.pending.length
            ? `<br>아직 확인 안 한 사람: ${ack.pending.map(p => esc(dn(p)) + `(${p.id in (pub.seats||{}) ? pub.seats[p.id]+1 : "-"}번)`).join(", ")}`
            : `<br>전원이 자리로 이동했어요.`}
        </div>` : ""}
      ${view.final ? `<div class="note ok" style="margin-bottom:10px">
        🏁 마지막 자리는 <b>새로운 사람보다 마음이 맞은 사람</b>을 우선합니다 —
        재회 회피를 끄고 상호 매칭을 최대한 같은 테이블에 모읍니다.
        <b>성비와 나이차 기준은 그대로</b> 지켜집니다.
      </div>` : ""}
      ${tablesHtml(view.seats, !!draft)}`}

    ${ev.seating.filter(s=>s.status==="published").length ? `
      <div class="sect">
        <div class="sect-head"><h2>발행 이력</h2></div>
        <div class="cards">
          ${ev.seating.filter(s=>s.status==="published").map(s => `
            <div class="host-row">
              <div class="info">
                <div class="nm">${roundLabel(s)}</div>
                <div class="sub">${fmtDT(s.at)} 발행 · 테이블 ${s.tables||ev.tables}개 · 이동확인 ${Object.keys(s.acks||{}).length}/${ev.players.filter(p=>s.seats[p.id]!==undefined).length}명</div>
                <div class="sub">나이차 ${s.metrics?s.metrics.ageBad:0}쌍 · 이성재회 ${s.metrics?s.metrics.repeatX:0}쌍</div>
              </div>
            </div>`).join("")}
        </div>
      </div>` : ""}`;
}

/* ── 참가자 ───────────────────────────────────── */
function viewMain(c){
  const ev = c.ev, m = c.m, pn = c.pane, st = c.st;
  const ph = phaseOf(ev);
  const revealed = isRevealed(ev);
  const pub = publishedSeating(ev);
  const myTable = pub ? pub.seats[m.id] : undefined;

  let body = "";
  if(st.tab === "people")      body = tabPeople(c, revealed);
  else if(st.tab === "alerts") body = tabAlerts(c, revealed);
  else                         body = tabMe(c, revealed);

  const newCount = gotPokes(ev, m.id).length;

  return `
  <div class="screen">
    <div class="topbar">
      <div class="who">
        ${avatar(m)}
        <div style="min-width:0">
          <div class="nm">${esc(dn(m))}</div>
          <div class="tiny muted">${esc(ev.name)} · ${PHASES[ph].label}</div>
        </div>
      </div>
      ${pn < 0 ? `<button class="btn-sm btn-ghost" onclick="go('entry')">나가기</button>` : ""}
    </div>

    <div class="strip">
      ${canPoke(ev) ? `
        <div class="cell hot">
          <div class="k">${ph==="prevote"?"사전투표 콕":"남은 콕"}</div>
          <div class="v">${leftPokes(ev,m.id)} <span style="font-size:13px;color:var(--muted)">/ ${pokeBudget(ev)}</span></div>
        </div>` : `
        <div class="cell">
          <div class="k">콕 찌르기</div>
          <div class="v" style="font-size:15px;color:var(--muted)">${ph==="done"?"마감했어요":"곧 시작해요"}</div>
        </div>`}
      ${revealed ? `
        <div class="cell done"><div class="k">결과</div><div class="v" style="font-size:17px">🎊 발표 완료</div></div>`
        : ph === "prevote" && ev.voteCloseAt ? `
        <div class="cell time">
          <div class="k">투표 마감까지</div>
          <div class="v" data-countdown="${ev.voteCloseAt}">${fmtDur(ev.voteCloseAt-Date.now())}</div>
        </div>`
        : ph === "party" && ev.revealAt ? `
        <div class="cell time">
          <div class="k">발표까지</div>
          <div class="v" data-countdown="${ev.revealAt}">${fmtDur(ev.revealAt-Date.now())}</div>
        </div>`
        : ph === "party" ? `
        <div class="cell"><div class="k">발표</div><div class="v" style="font-size:15px;color:var(--muted)">곧 발표해요</div></div>`
        : `
        <div class="cell"><div class="k">함께하는 사람</div><div class="v">${ev.players.length}<span style="font-size:13px;color:var(--muted)">명</span></div></div>`}
    </div>

    ${(() => {
      const n = latestNotice(ev);
      if(!n) return "";
      return `
      <div class="phase-banner ${n.warn?"warn":""}" onclick="goTab('alerts', ${pn})">
        <div class="ic">${n.ic}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:14.5px">${n.t}</div>
          <div class="tiny muted">${n.s}</div>
        </div>
      </div>`;
    })()}

    ${myTable !== undefined ? `
      <div class="seat-banner" onclick="goTab('me', ${pn})">
        <div class="no">${myTable+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:14.5px">${roundLabel(pub)} · ${myTable+1}번 테이블</div>
          <div class="tiny muted">같은 테이블 ${ev.players.filter(p=>p.id!==m.id && pub.seats[p.id]===myTable).length}명 · 눌러서 확인</div>
        </div>
        <span style="font-size:17px">🪑</span>
      </div>` : ""}

    ${body}
  </div>

  <nav class="nav">
    <button class="${st.tab==="people"?"on":""}" onclick="goTab('people', ${pn})"><span class="ic">👥</span>참가자</button>
    <button class="${st.tab==="alerts"?"on":""}" onclick="goTab('alerts', ${pn})"><span class="ic">🔔</span>알림${newCount?`<span class="badge">${newCount}</span>`:""}</button>
    <button class="${st.tab==="me"?"on":""}" onclick="goTab('me', ${pn})"><span class="ic">🙋</span>내 정보</button>
  </nav>`;
}

function tabPeople(c, revealed){
  const ev = c.ev, m = c.m, pn = c.pane, st = c.st;
  const list = ev.players.filter(p => p.id !== m.id && (!st.onlyOpposite || p.gender !== m.gender));
  const allowed = canPoke(ev);
  return `
    <div class="segmented">
      <button class="${st.onlyOpposite?"on":""}" onclick="setOpp(true, ${pn})">이성만</button>
      <button class="${!st.onlyOpposite?"on":""}" onclick="setOpp(false, ${pn})">전체 보기</button>
    </div>
    ${!allowed ? `<div class="note" style="margin-bottom:12px">
      ${phaseOf(ev)==="done" ? "발표가 끝나 콕 찌르기는 마감되었어요." : "아직 콕 찌르기가 시작되지 않았어요. 운영자가 시작하면 알려드릴게요."}
    </div>` : ""}
    <div class="sect-head"><h2>참가자 ${list.length}명</h2><span class="tiny muted">카드를 누르면 프로필</span></div>
    ${list.length === 0 ? `<div class="empty"><div class="ico">🫥</div><p>아직 등록된 상대가 없어요.</p></div>` : `
      <div class="cards">
        ${list.map(p => {
          const n = allowed ? pokeCount(ev, m.id, p.id, pokePhase(ev)) : 0;
          const same = p.gender === m.gender;
          return `
          <div class="card ${n?"poked":""}" onclick="setSheet('${p.id}', ${pn})">
            ${avatar(p)}
            <div class="info">
              <div class="l1"><span class="nm">${esc(dn(p))}</span><span class="tiny muted">${p.age}</span>${mbtiTag(p.mbti)}</div>
              ${charmLine(p)}
            </div>
            <button class="poke-btn ${n?"on":""}" data-poke="${pn}:${p.id}" ${same||!allowed?"disabled":""} onclick="askPoke('${p.id}', event, ${pn})">
              👉${n ? `<span class="n">${n}</span>` : ""}
            </button>
          </div>`;
        }).join("")}
      </div>`}`;
}

function tabAlerts(c, revealed){
  const ev = c.ev, m = c.m, pn = c.pane;
  const pub = ev.seating.filter(s => s.status === "published");
  const seatNotices = pub.slice().reverse().map(s => `
    <div class="alert seat">
      <div class="bell">🪑</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14.5px">${s.final ? "🏁 마지막 자리가 정해졌어요" : s.round + "라운드 자리가 정해졌어요"}</div>
        <div class="tiny muted">${fmtDT(s.at)} · ${s.seats[m.id] !== undefined
          ? (revealed ? `${s.seats[m.id]+1}번 테이블이었어요` : `${s.seats[m.id]+1}번 테이블로 이동해주세요`)
          : "배정 없음"}</div>
      </div>
    </div>`).join("");

  const got = gotPokes(ev, m.id).slice().sort((a,b) => a.at - b.at);
  const notices = phaseNotices(ev);
  const noticeHtml = notices.length ? `
    <div class="sect">
      <div class="sect-head"><h2>📢 진행 안내</h2></div>
      <div class="cards">
        ${notices.map(n => `
          <div class="alert${n.warn?" warn-alert":""}">
            <div class="bell">${n.ic}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14.5px">${n.t}</div>
              <div class="tiny muted">${fmtDT(n.at)} · ${n.s}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>` : "";

  if(!revealed){
    return `
      ${noticeHtml}
      ${pub.length ? `<div class="sect"><div class="sect-head"><h2>🪑 자리 안내</h2></div><div class="cards">${seatNotices}</div></div>` : ""}
      <div class="sect">
        <div class="sect-head"><h2>🔔 받은 콕</h2></div>
        ${got.length === 0 ? `<div class="empty"><div class="ico">🔕</div><p>아직 받은 콕이 없어요.<br>먼저 마음에 드는 사람을 찔러보는 건 어때요?</p></div>` : `
          <div class="locked" style="margin-bottom:10px">
            <div class="big">💌</div>
            <div style="font-size:17px;font-weight:800">누군가 당신을 <span style="color:var(--pink)">${got.length}번</span> 찔렀어요</div>
            <div class="tiny muted" style="margin-top:8px">발표 때 <b>서로 찌른 상대만</b> 공개돼요</div>
          </div>
          <div class="cards">
            ${got.map(g => `
              <div class="alert">
                <div class="bell">❓</div>
                <div style="flex:1">
                  <div style="font-weight:700;font-size:14.5px">누군가 콕! 찔렀어요</div>
                  <div class="tiny muted">${fmtDT(g.at)} · ${g.phase==="pre"?"사전 투표":"파티 중"} · 익명</div>
                </div>
              </div>`).join("")}
          </div>`}
      </div>`;
  }

  const mutuals = ev.players.filter(p => p.id !== m.id && isMutual(ev, m.id, p.id));
  const anonCount = got.filter(g => !mutuals.some(p => p.id === g.from)).length;
  const pubLast = publishedSeating(ev);

  return `
    <div class="sect">
      <div class="sect-head"><h2>💘 서로 찔렀어요</h2></div>
      ${mutuals.length === 0 ? `
        <div class="note">${got.length === 0
          ? `이번엔 서로 닿지 않았네요.<br>오늘 같은 테이블에서 나눈 이야기가 더 오래 남을 수도 있어요.`
          : `이번엔 서로 찌른 상대가 없었어요.<br>그래도 <b>${got.length}번</b>의 콕을 받았답니다 — 누구인지는 끝까지 비밀이에요 😉`}</div>` : `
        <div class="cards">
          ${mutuals.map(p => {
            const a = pubLast ? pubLast.seats[m.id] : undefined;
            const b = pubLast ? pubLast.seats[p.id] : undefined;
            const hint = (a !== undefined && a === b) ? `같은 ${a+1}번 테이블이에요 — 옆자리에서 인사해보세요` : `파티장에서 직접 인사하고 연락처를 나눠보세요`;
            return `
            <div class="alert mutual" onclick="setSheet('${p.id}', ${pn})">
              ${avatar(p)}
              <div style="flex:1;min-width:0">
                <div style="font-weight:800;font-size:15px">${esc(dn(p))} · ${p.age} ${mbtiTag(p.mbti)}</div>
                <div class="tiny" style="color:var(--gold)">${hint}</div>
              </div>
              <span style="font-size:20px">💘</span>
            </div>`;
          }).join("")}
        </div>`}
    </div>
    ${anonCount ? `
      <div class="sect">
        <div class="sect-head"><h2>🔒 익명으로 남은 콕 ${anonCount}회</h2></div>
        <div class="note">한쪽만 찌른 경우에는 상대가 누구인지 <b>공개되지 않아요</b>. 서로 찔렀을 때만 알 수 있습니다.</div>
      </div>` : ""}
    ${pub.length ? `<div class="sect"><div class="sect-head"><h2>🪑 자리 안내</h2></div><div class="cards">${seatNotices}</div></div>` : ""}
    ${noticeHtml}`;
}

function tabMe(c, revealed){
  const ev = c.ev, m = c.m, pn = c.pane;
  const ph = pokePhase(ev);
  const sentTargets = [...new Set(ev.pokes.filter(p => p.from === m.id).map(p => p.to))];
  const pub = publishedSeating(ev);
  const myT = pub ? pub.seats[m.id] : undefined;
  const mates = myT !== undefined ? ev.players.filter(p => p.id !== m.id && pub.seats[p.id] === myT) : [];

  return `
    <div class="sect" style="text-align:center;padding:8px 0 18px">
      <div style="display:flex;justify-content:center;margin-bottom:12px">${avatar(m,"lg")}</div>
      <div style="font-size:21px;font-weight:800">${esc(dn(m))}</div>
      <div class="tiny muted" style="margin-top:5px">${m.gender==="M"?"남성":"여성"} · ${m.age}세 · 실명 ${esc(m.name)}</div>
      <div class="tiny muted" style="margin-top:3px">${esc(m.phone)}${m.insta?` · @${esc(m.insta)}`:""}</div>
      <div style="margin-top:10px">${mbtiTag(m.mbti)}</div>
      <div style="display:flex;justify-content:center;margin-top:10px">${charmChips(m)}</div>
    </div>

    ${myT !== undefined ? `
      <div class="sect">
        <div class="sect-head"><h2>🪑 내 자리 · ${myT+1}번 테이블</h2><span class="tiny muted">${roundLabel(pub)} · ${mates.length}명과 함께</span></div>
        ${mates.length === 0 ? `<div class="note">아직 같은 테이블에 다른 참가자가 없어요.</div>` : `
          <div class="cards">
            ${mates.map(p => `
              <div class="card" onclick="setSheet('${p.id}', ${pn})">
                ${avatar(p)}
                <div class="info">
                  <div class="l1"><span class="nm">${esc(dn(p))}</span><span class="tiny muted">${p.age}</span>${mbtiTag(p.mbti)}</div>
                  ${charmLine(p)}
                </div>
                ${pokeCount(ev,m.id,p.id)?`<span style="font-size:17px">👉</span>`:""}
              </div>`).join("")}
          </div>`}
      </div>` : ""}

    <div class="sect">
      <div class="sect-head">
        <h2>내가 찌른 사람</h2>
        <span class="tiny muted">${canPoke(ev) ? "카드에서 조절할 수 있어요" : "마감"}</span>
      </div>
      ${sentTargets.length === 0 ? `
        <div class="empty"><div class="ico">👉</div><p>아직 아무도 찌르지 않았어요.<br>찌르지 않아도 괜찮아요 — 선택이에요.</p></div>` : `
        <div class="cards">
          ${sentTargets.map(id => {
            const p = P(ev,id); if(!p) return "";
            const total = pokeCount(ev, m.id, id);
            const mutual = revealed && isMutual(ev, m.id, id);
            return `
            <div class="card ${mutual?"poked":""}" onclick="setSheet('${p.id}', ${pn})">
              ${avatar(p)}
              <div class="info">
                <div class="l1"><span class="nm">${esc(dn(p))}</span><span class="tiny muted">${p.age}</span>${mbtiTag(p.mbti)}</div>
                <div class="tiny muted">${mutual?'<span style="color:var(--gold)">💘 서로 찔렀어요!</span> · ':""}총 ${total}회 찌름</div>
              </div>
              <div class="poke-btn on">👉<span class="n">${total}</span></div>
            </div>`;
          }).join("")}
        </div>`}
    </div>

    <div class="note">
      실명 · 전화번호 · 인스타는 <b>나와 운영자만</b> 볼 수 있어요.
      서로 찌른 상대에게도 공개되지 않으니, 매칭된 사람과는 파티장에서 직접 인사해주세요.
    </div>`;
}

function viewSheet(c){
  const ev = c.ev, m = c.m, pn = c.pane, id = c.st.sheet;
  const p = P(ev, id);
  if(!p || !m) return "";
  const same = p.gender === m.gender;
  const allowed = canPoke(ev) && !same;
  const ph = pokePhase(ev);
  const n = pokeCount(ev, m.id, p.id, ph);
  const revealed = isRevealed(ev);
  const mutual = revealed && isMutual(ev, m.id, p.id);

  return `
  <div class="sheet-bg" onclick="setSheet(null, ${pn})">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="grab"></div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        ${avatar(p,"lg")}
        <div style="min-width:0">
          <div style="font-size:21px;font-weight:800">${esc(dn(p))}</div>
          <div class="tiny muted" style="margin:4px 0 7px">${p.gender==="M"?"남성":"여성"} · ${p.age}세</div>
          ${mbtiTag(p.mbti)}
        </div>
      </div>

      <div class="sect-head"><h2 style="font-size:13px">이 사람의 매력</h2></div>
      <div class="cards" style="gap:7px;margin-bottom:16px">
        ${(p.charms||[]).filter(Boolean).map((c,i) => `
          <div class="host-row" style="padding:10px 13px">
            <div class="charm-num" style="width:22px;font-weight:800;color:var(--muted);font-size:12px">${i+1}</div>
            <div class="info"><div class="nm" style="font-size:14px">${esc(c)}</div></div>
          </div>`).join("") || `<div class="note">등록된 매력이 없어요.</div>`}
      </div>

      ${mutual ? `<div class="note" style="margin-bottom:14px;border-color:rgba(255,209,102,.4);color:var(--gold)">
        💘 <b>서로 찔렀어요!</b><br>파티장에서 직접 인사해보세요.
      </div>` : ""}

      ${same ? `<div class="note">동성 참가자에게는 찌르기를 보낼 수 없어요.</div>` :
        !canPoke(ev) ? `<div class="note">${phaseOf(ev)==="done"
          ? "발표가 끝나 콕 찌르기는 마감되었어요."
          : "아직 콕 찌르기가 시작되지 않았어요. 운영자가 시작하면 알려드릴게요."}</div>` : `
        <div class="tiny muted" style="text-align:center;margin-bottom:8px">
          ${ph==="pre"?"사전 투표":"파티"} 라운드 · 남은 횟수 ${leftPokes(ev,m.id)}회 (같은 사람에게 여러 번도 가능)
        </div>
        <div class="stepper" style="margin-bottom:10px">
          <button onclick="removePoke('${p.id}', event, ${pn})" ${n<=0?"disabled":""}>−</button>
          <div class="n">👉 ${n}</div>
          <button onclick="askPoke('${p.id}', event, ${pn})" ${leftPokes(ev,m.id)<=0?"disabled":""}>+</button>
        </div>
        <button class="btn btn-ghost" onclick="setSheet(null, ${pn})">닫기</button>`}
    </div>
  </div>`;
}

/* ── 운영자: 참가자 상세 ──────────────────────── */
function viewPlayerSheet(id){
  const ev = hostEv(), p = P(ev, id);
  if(!p) return "";

  const tally = (dir) => {
    const map = {};
    for(const x of ev.pokes){
      if(dir === "sent" && x.from !== p.id) continue;
      if(dir === "got"  && x.to   !== p.id) continue;
      const other = dir === "sent" ? x.to : x.from;
      map[other] = map[other] || { pre:0, party:0 };
      map[other][x.phase]++;
    }
    return Object.entries(map)
      .map(([oid, c]) => ({ o: P(ev, oid), ...c, total: c.pre + c.party }))
      .filter(x => x.o)
      .sort((a,b) => b.total - a.total || dn(a.o).localeCompare(dn(b.o)));
  };
  const sent = tally("sent"), got = tally("got");

  const meter = (used, max, label, color) => `
    <div class="use">
      <div class="use-top">
        <span>${label}</span>
        <b><em style="color:${color}">${used}</em> / ${max}회 사용</b>
      </div>
      <div class="meter"><i style="width:${max ? Math.min(100, used/max*100) : 0}%;background:${color}"></i></div>
      <div class="tiny muted" style="margin-top:5px">남은 횟수 ${Math.max(0, max - used)}회</div>
    </div>`;

  const pokeRow = (x, dir) => {
    const mutual = isMutual(ev, p.id, x.o.id);
    return `
    <div class="host-row" style="padding:9px 12px">
      ${avatar(x.o, "sm")}
      <div class="info">
        <div class="nm" style="font-size:13.5px">${esc(dn(x.o))} <span class="sub">${esc(x.o.name)} · ${x.o.age}</span></div>
        <div class="sub">${x.pre ? `사전 ${x.pre}회` : ""}${x.pre && x.party ? " · " : ""}${x.party ? `파티 ${x.party}회` : ""}</div>
      </div>
      ${mutual ? `<span class="tiny" style="color:var(--gold);font-weight:800;flex:0 0 auto">💘 상호</span>` : ""}
      <span class="poke-badge">${dir === "sent" ? "👉" : "👈"} ${x.total}</span>
    </div>`;
  };

  const seatHist = ev.seating.filter(s => s.status === "published");

  return `
  <div class="sheet-bg" onclick="closePlayerSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="grab"></div>

      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        ${avatar(p, "lg")}
        <div style="min-width:0">
          <div style="font-size:21px;font-weight:800">${esc(dn(p))}</div>
          <div class="tiny muted" style="margin:4px 0 7px">${esc(p.name)} · ${p.gender==="M"?"남성":"여성"} · ${p.age}세</div>
          ${mbtiTag(p.mbti)}
        </div>
      </div>

      <div class="sect-head"><h2 style="font-size:13px">등록 정보</h2></div>
      <div class="kv">
        <div class="r"><span>닉네임</span><b>${esc(p.nick || "-")}</b></div>
        <div class="r"><span>실명</span><b>${esc(p.name)}</b></div>
        <div class="r"><span>나이 · 성별</span><b>${p.age}세 · ${p.gender==="M"?"남성":"여성"}</b></div>
        <div class="r"><span>MBTI</span><b>${esc(p.mbti)}</b></div>
        <div class="r"><span>전화번호</span><b>${esc(p.phone)}</b></div>
        <div class="r"><span>인스타</span><b>${p.insta ? "@"+esc(p.insta) : "미입력"}</b></div>
      </div>
      <div style="margin:10px 0 18px">
        <div class="tiny muted" style="margin-bottom:6px">매력 3가지</div>
        ${charmChips(p)}
      </div>

      <div class="sect-head"><h2 style="font-size:13px">콕 사용 현황</h2></div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:18px">
        ${meter(sentCount(ev,p.id,"pre"), ev.maxPre, "사전 투표", "var(--gold)")}
        ${meter(sentCount(ev,p.id,"party"), ev.maxParty, "파티 중", "var(--pink)")}
      </div>

      <div class="stat-grid" style="margin-bottom:18px">
        <div class="stat"><div class="v">${sent.reduce((a,x)=>a+x.total,0)}</div><div class="k">보낸 콕</div></div>
        <div class="stat"><div class="v" style="color:var(--mint)">${got.reduce((a,x)=>a+x.total,0)}</div><div class="k">받은 콕</div></div>
        <div class="stat"><div class="v" style="color:var(--gold)">${sent.filter(x=>isMutual(ev,p.id,x.o.id)).length}</div><div class="k">상호 매칭</div></div>
      </div>

      <div class="sect-head"><h2 style="font-size:13px">👉 이 사람이 찌른 사람 ${sent.length}명</h2></div>
      <div class="cards" style="gap:7px;margin-bottom:18px">
        ${sent.length ? sent.map(x => pokeRow(x,"sent")).join("") : `<div class="note">아직 아무도 찌르지 않았어요. (0회도 허용됩니다)</div>`}
      </div>

      <div class="sect-head"><h2 style="font-size:13px">👈 이 사람을 찌른 사람 ${got.length}명</h2></div>
      <div class="cards" style="gap:7px;margin-bottom:18px">
        ${got.length ? got.map(x => pokeRow(x,"got")).join("") : `<div class="note">아직 받은 콕이 없어요.</div>`}
      </div>

      ${seatHist.length ? `
        <div class="sect-head"><h2 style="font-size:13px">🪑 자리 이력</h2></div>
        <div class="kv" style="margin-bottom:18px">
          ${seatHist.map(s => `<div class="r"><span>${roundLabel(s)}</span><b>${s.seats[p.id] !== undefined ? (s.seats[p.id]+1)+"번 테이블" : "미배정"}</b></div>`).join("")}
        </div>` : ""}

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="closePlayerSheet()">닫기</button>
        <button class="btn btn-ghost" style="color:#ff8fa8" onclick="askRemovePlayer('${p.id}', event)">참가자 삭제</button>
      </div>
    </div>
  </div>`;
}

/* ── 운영자 확인 다이얼로그 ───────────────────── */
function viewHostConfirm(c){
  const ev = hostEv();
  if(!ev) return "";

  if(c.type === "phase" || c.type === "unreveal"){
    const isBack = c.type === "unreveal";
    const a = isBack
      ? { title:"발표를 취소할까요?", btn:"발표 취소", danger:true, lines:[
          ["참가자 화면", "결과가 다시 숨겨집니다"],
          ["콕 찌르기", "파티 진행 단계로 돌아가 다시 열립니다"],
          ["이미 본 사람", "되돌릴 수 없어요"],
        ] }
      : phaseAction(ev, c.to);
    if(!a) return "";
    return `
    <div class="dlg-bg" onclick="cancelHostConfirm()">
      <div class="dlg" onclick="event.stopPropagation()">
        <div style="text-align:center">
          <div style="font-size:32px;margin-bottom:8px">${isBack ? "↩︎" : c.to === "done" ? "🎊" : "▶︎"}</div>
          <div class="tiny muted">${esc(ev.name)}</div>
          <div style="font-size:17px;font-weight:800;margin-top:6px;${a.danger?"color:#ff8fa8":""}">${a.title}</div>
          ${!isBack ? `<div class="tiny muted" style="margin-top:7px">
            ${PHASES[phaseOf(ev)].label} <span style="opacity:.6">→</span> <b style="color:var(--text)">${PHASES[c.to].label}</b>
          </div>` : ""}
        </div>
        <div class="dlg-facts">
          ${a.lines.map(([k,v]) => `<div class="row" style="align-items:flex-start"><span style="flex:0 0 76px">${k}</span><b style="text-align:right;white-space:normal;font-weight:600;font-size:12px;line-height:1.5">${v}</b></div>`).join("")}
        </div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn btn-ghost" onclick="cancelHostConfirm()">취소</button>
          <button class="btn ${a.danger?"btn-danger":"btn-primary"}" onclick="confirmHostAction()">${a.btn}</button>
        </div>
      </div>
    </div>`;
  }

  if(c.type === "delEvent"){
    const t = EV(c.id);
    if(!t) return "";
    const rounds = t.seating.filter(x => x.status === "published").length;
    return `
    <div class="dlg-bg" onclick="cancelHostConfirm()">
      <div class="dlg" onclick="event.stopPropagation()">
        <div style="text-align:center">
          <div style="font-size:32px;margin-bottom:8px">🗑️</div>
          <div style="font-size:18px;font-weight:800">${esc(t.name)}</div>
          <div class="tiny muted" style="margin-top:5px">입장 코드 ${esc(t.code||"-")}</div>
          <div style="font-size:16px;font-weight:700;margin-top:12px;color:#ff8fa8">이 회차를 통째로 삭제할까요?</div>
        </div>
        <div class="dlg-facts">
          <div class="row"><span>참가자</span><b>${t.players.length}명 <span class="arrow">→</span> <em>삭제</em></b></div>
          <div class="row"><span>콕 기록</span><b>${t.pokes.length}회 <span class="arrow">→</span> <em>삭제</em></b></div>
          <div class="row"><span>발행한 자리</span><b>${rounds}라운드 <span class="arrow">→</span> <em>삭제</em></b></div>
        </div>
        <div class="tiny muted" style="text-align:center;margin:12px 0 14px;line-height:1.6">
          참가자 명단과 연락처, 콕 기록이 <b>모두 사라지고 되돌릴 수 없어요.</b><br>
          파티가 끝났다면 삭제 대신 <b>발표 완료</b> 상태로 두는 것도 방법이에요.
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="cancelHostConfirm()">취소</button>
          <button class="btn btn-danger" onclick="confirmHostAction()">삭제하기</button>
        </div>
      </div>
    </div>`;
  }

  if(c.type !== "delPlayer") return "";
  const p = P(ev, c.id);
  if(!p) return "";
  const sent = ev.pokes.filter(x => x.from === c.id).length;
  const got  = ev.pokes.filter(x => x.to === c.id).length;
  const seated = ev.seating.filter(s => s.seats[c.id] !== undefined).length;

  return `
  <div class="dlg-bg" onclick="cancelHostConfirm()">
    <div class="dlg" onclick="event.stopPropagation()">
      <div style="text-align:center">
        <div style="display:flex;justify-content:center;margin-bottom:12px">${avatar(p,"lg")}</div>
        <div style="font-size:19px;font-weight:800">${esc(dn(p))}</div>
        <div class="tiny muted" style="margin-top:4px">${esc(p.name)} · ${p.age}세 · ${esc(p.phone)}</div>
        <div style="font-size:16px;font-weight:700;margin-top:14px;color:#ff8fa8">이 참가자를 삭제할까요?</div>
      </div>

      <div class="dlg-facts">
        <div class="row"><span>보낸 콕</span><b>${sent}회 <span class="arrow">→</span> <em>삭제</em></b></div>
        <div class="row"><span>받은 콕</span><b>${got}회 <span class="arrow">→</span> <em>삭제</em></b></div>
        <div class="row"><span>배정된 자리</span><b>${seated}개 라운드 <span class="arrow">→</span> <em>해제</em></b></div>
      </div>

      <div class="tiny muted" style="text-align:center;margin:12px 0 14px;line-height:1.6">
        이 참가자가 주고받은 콕 기록이 <b>모두 사라지고 되돌릴 수 없어요.</b><br>
        이미 발행한 자리에서도 빠집니다.
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="cancelHostConfirm()">취소</button>
        <button class="btn btn-danger" onclick="confirmHostAction()">삭제하기</button>
      </div>
    </div>
  </div>`;
}

/* ── 자리 이동 안내 (참가자 전체 화면) ────────── */
function viewSeatAck(c){
  const pub = needSeatAck(c.ev, c.m ? c.m.id : null);
  if(!pub) return "";
  const t = pub.seats[c.m.id];
  const mates = c.ev.players.filter(p => p.id !== c.m.id && pub.seats[p.id] === t);
  const men = mates.filter(p => p.gender === "M").length;

  return `
  <div class="dlg-bg seat-ack">
    <div class="dlg" onclick="event.stopPropagation()">
      <div style="text-align:center">
        <div style="font-size:34px;margin-bottom:6px">🪑</div>
        <div class="tiny" style="color:var(--mint);font-weight:800;letter-spacing:.06em">
          ${pub.final ? "마지막 자리예요" : pub.round + "라운드 자리가 정해졌어요"}
        </div>
        <div class="table-no">${t+1}</div>
        <div style="font-size:17px;font-weight:800;margin-top:2px">${t+1}번 테이블로 이동해주세요</div>
        <div class="tiny muted" style="margin-top:7px">
          같은 테이블 ${mates.length}명 · 남 ${men} / 여 ${mates.length-men}
        </div>
      </div>

      ${mates.length ? `
        <div class="ack-mates">
          ${mates.map(p => `
            <div class="ack-mate">
              ${avatar(p,"sm")}
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:13px">${esc(dn(p))} <span class="tiny muted">${p.age}</span></div>
              </div>
              ${mbtiTag(p.mbti)}
            </div>`).join("")}
        </div>` : ""}

      <button class="btn btn-primary" style="margin-top:14px" onclick="ackSeat(${c.pane})">자리로 이동했어요</button>
      <div class="tiny muted" style="text-align:center;margin-top:9px">운영자가 이동 현황을 보고 있어요</div>
    </div>
  </div>`;
}

/* ── 콕 확인 다이얼로그 ───────────────────────── */
function viewConfirm(c){
  const ev = c.ev, m = c.m, pn = c.pane, id = c.st.confirm;
  const p = P(ev, id);
  if(!p || !m) return "";
  const ph = pokePhase(ev);
  const now = pokeCount(ev, m.id, p.id, ph);
  const left = leftPokes(ev, m.id);

  return `
  <div class="dlg-bg" onclick="cancelConfirm(${pn})">
    <div class="dlg" onclick="event.stopPropagation()">
      <div style="text-align:center">
        <div style="display:flex;justify-content:center;margin-bottom:12px">${avatar(p,"lg")}</div>
        <div style="font-size:19px;font-weight:800">${esc(dn(p))}</div>
        <div class="tiny muted" style="margin-top:4px">${p.age}세 · ${esc(p.mbti)}</div>
        <div style="font-size:16px;font-weight:700;margin-top:14px">
          ${now > 0 ? "한 번 더 콕 찌를까요?" : "이 사람을 콕 찌를까요?"}
        </div>
      </div>

      <div class="dlg-facts">
        <div class="row">
          <span>이 사람에게 보낸 콕</span>
          <b>${now}회 <span class="arrow">→</span> <em>${now+1}회</em></b>
        </div>
        <div class="row">
          <span>${ph==="pre"?"사전 투표":"파티"} 남은 횟수</span>
          <b>${left}회 <span class="arrow">→</span> <em>${left-1}회</em></b>
        </div>
      </div>

      <div class="tiny muted" style="text-align:center;margin:12px 0 14px;line-height:1.6">
        상대에게는 <b>누가 찔렀는지 보이지 않아요.</b><br>
        발표 전까지는 프로필에서 <b>되돌릴</b> 수 있어요.
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="cancelConfirm(${pn})">취소</button>
        <button class="btn btn-primary" onclick="confirmPoke(${pn})">👉 콕 찌르기</button>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   데모 뷰 — 참가자 화면 여러 개를 나란히 놓고 시연
   ══════════════════════════════════════════════════════════ */
function openDemo(){
  const ev = EV(S.demoEvId) || EV(S.evId) || DB.events.find(e => e.players.length) || DB.events[0];
  if(!ev){ toast("먼저 데모 회차를 만들어주세요"); return; }
  syncDemoPanes(ev.id);
  S.screen = "demo";
  render();
}
function syncDemoPanes(evId){
  S.demoEvId = evId;
  const ev = EV(evId);
  const men = ev ? ev.players.filter(p => p.gender === "M") : [];
  const women = ev ? ev.players.filter(p => p.gender === "F") : [];
  const pick = [men[0], women[0], women[1] || men[1]];
  S.panes.forEach((st, i) => {
    st.evId = evId;
    const stillHere = st.meId && ev && ev.players.some(p => p.id === st.meId);
    if(!stillHere) st.meId = pick[i] ? pick[i].id : (ev && ev.players[i] ? ev.players[i].id : null);
    st.sheet = null; st.confirm = null;
  });
}
function demoPickEvent(id){ syncDemoPanes(id); render(); }
function demoSetPane(i, pid){ S.panes[i].meId = pid || null; S.panes[i].sheet = null; S.panes[i].confirm = null; render(); }
function demoSetCount(n){ S.paneCount = n; render(); }

function demoPhase(ph){
  const ev = EV(S.demoEvId); if(!ev) return;
  setPhase(ev, ph);
  render();
  toast(`단계 → ${PHASES[ph].label}`);
}
function demoSeat(final){
  const ev = EV(S.demoEvId); if(!ev) return;
  if(!ev.players.length){ toast("참가자가 없어요"); return; }
  const keep = S.hostEvId;
  S.hostEvId = ev.id;
  if(isSeatClosed(ev)) ev.seating.forEach(x => { x.final = false; });
  ev.seating = ev.seating.filter(x => x.status !== "draft");
  makeSeating(!!final);
  publishSeating();
  S.hostEvId = keep;
  render();
  toast(final ? "🏁 마지막 자리를 배정하고 알렸어요" : "자리를 배정하고 참가자에게 알렸어요");
}

function viewDemo(){
  const ev = EV(S.demoEvId);
  const ph = ev ? phaseOf(ev) : "prep";
  const n = Math.min(S.paneCount, S.panes.length);

  const phoneHtml = (i) => {
    const c = vctx(i);
    if(!c.ev || !c.m){
      return `
      <div class="phone">
        <div class="phone-top">
          <select onchange="demoSetPane(${i}, this.value)">
            <option value="">참가자 선택</option>
            ${(c.ev ? c.ev.players : []).map(p => `<option value="${p.id}">${esc(dn(p))}</option>`).join("")}
          </select>
        </div>
        <div class="phone-empty">참가자를 선택하면<br>그 사람 화면이 그대로 보여요</div>
      </div>`;
    }
    return `
    <div class="phone">
      <div class="phone-top">
        <span class="who-tag ${c.m.gender==="M"?"tag-SJ":"tag-SP"}">${c.m.gender==="M"?"남":"여"}</span>
        <select onchange="demoSetPane(${i}, this.value)">
          ${c.ev.players.map(p => `<option value="${p.id}" ${p.id===c.m.id?"selected":""}>${esc(dn(p))} · ${p.age}</option>`).join("")}
        </select>
      </div>
      <div class="phone-body">${viewMain(c)}</div>
      ${c.st.sheet ? viewSheet(c) : ""}
      ${c.st.confirm ? viewConfirm(c) : ""}
      ${viewSeatAck(c)}
    </div>`;
  };

  return `
  <div class="screen no-nav demo-wrap">
    <div class="topbar">
      <div class="who">
        <div class="avatar" style="background:linear-gradient(140deg,var(--mint),var(--blue))">👀</div>
        <div style="min-width:0">
          <div class="nm">데모 뷰</div>
          <div class="tiny muted">참가자 화면을 나란히 놓고 시연</div>
        </div>
      </div>
      <button class="btn-sm btn-ghost" onclick="go('entry')">나가기</button>
    </div>

    <div class="demo-bar">
      <span class="lbl">회차</span>
      <select onchange="demoPickEvent(this.value)">
        ${DB.events.map(e => `<option value="${e.id}" ${e.id===S.demoEvId?"selected":""}>${esc(e.name)}</option>`).join("")}
      </select>
      <span class="lbl">화면</span>
      ${[1,2,3].map(k => `<button class="demo-step ${S.paneCount===k?"on":""}" onclick="demoSetCount(${k})">${k}개</button>`).join("")}
    </div>

    <div class="demo-bar">
      <span class="lbl">단계</span>
      ${PHASE_ORDER.map(x => `<button class="demo-step ${ph===x?"on":""}" onclick="demoPhase('${x}')">${PHASES[x].label}</button>`).join("")}
    </div>

    <div class="demo-bar">
      <span class="lbl">자리</span>
      <button class="demo-step" ${ph==="done"?"disabled":""} onclick="demoSeat(false)">🪑 배정 + 알림</button>
      <button class="demo-step" ${ph==="done"?"disabled":""} onclick="demoSeat(true)">🏁 마지막 자리</button>
      ${ph==="done" ? `<span class="tiny muted">발표 후엔 자리를 바꾸지 않아요</span>` : ""}
      <span class="tiny muted">발행 ${ev ? ev.seating.filter(s=>s.status==="published").length : 0}라운드</span>
    </div>

    ${!ev || !ev.players.length ? `
      <div class="empty"><div class="ico">📱</div><p>참가자가 없는 회차예요.<br>상단 <b>데모 회차</b> 버튼으로 샘플을 만들어보세요.</p></div>` : `
      <div class="phones">${Array.from({length:n},(_,i) => phoneHtml(i)).join("")}</div>`}

    <div class="note" style="margin-top:12px">
      각 화면은 <b>서로 독립적으로</b> 움직입니다. 왼쪽에서 콕을 찌르면 오른쪽 <b>알림</b> 탭에 바로 반영돼요.
      단계를 <b>발표 완료</b>로 옮기면 서로 찌른 쌍만 공개되는 것도 확인할 수 있습니다.
    </div>
  </div>`;
}

/* ── 등록 ─────────────────────────────────────── */
function viewRegister(){
  const ev = curEv();
  const d = S.draft, g = d.gender;
  const gate = canRegister(ev);
  const STEPS = ["프로필","연락처","성향·매력"];
  const st = S.regStep;

  const step1 = () => `
    <div class="field">
      <label>닉네임 <span class="req">*</span> <span class="muted" style="font-weight:600">— 다른 참가자에게 보이는 이름</span></label>
      <input class="input" id="f-nick" placeholder="예) 클라이밍하는곰" maxlength="12" value="${esc(d.nick)}">
    </div>
    <div class="field">
      <label>이름 (실명) <span class="req">*</span> <span class="muted" style="font-weight:600">— 운영자 확인용</span></label>
      <input class="input" id="f-name" placeholder="홍길동" maxlength="12" value="${esc(d.name)}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:11px">
      <div class="field">
        <label>나이 <span class="req">*</span></label>
        <input class="input" id="f-age" type="number" inputmode="numeric" placeholder="29" min="18" max="99" value="${esc(d.age)}">
      </div>
      <div class="field">
        <label>성별 <span class="req">*</span></label>
        <div class="choice">
          <button data-g="M" class="${g==="M"?"on":""}" onclick="pickGender('M')">남성</button>
          <button data-g="F" class="${g==="F"?"on":""}" onclick="pickGender('F')">여성</button>
        </div>
      </div>
    </div>`;

  const step2 = () => `
    <div class="note" style="margin-bottom:16px">
      여기 적는 건 <b>운영자만</b> 봅니다. 다른 참가자에게는 매칭이 되어도 공개되지 않아요.
    </div>
    <div class="field">
      <label>전화번호 <span class="req">*</span> <span class="muted" style="font-weight:600">— 다시 접속할 때 본인 확인용</span></label>
      <input class="input" id="f-phone" type="tel" inputmode="tel" placeholder="010-1234-5678" value="${esc(d.phone)}">
    </div>
    <div class="field">
      <label>인스타 아이디 <span class="muted" style="font-weight:600">(선택)</span></label>
      <div class="input-at"><span>@</span>
        <input id="f-insta" placeholder="instagram_id" maxlength="30" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(d.insta)}">
      </div>
    </div>`;

  const step3 = () => `
    <div class="field">
      <label>성향 <span class="req">*</span> <span class="muted" style="font-weight:600">— 네 가지만 골라주세요</span></label>
      ${MBTI_AXES.map((ax, i) => `
        <div class="axis">
          <div class="axis-q">${ax.q}</div>
          <div class="axis-opts">
            ${ax.opts.map(([L, label]) => `
              <button data-axis="${i}" data-letter="${L}" class="${d.axes[i]===L?"on":""}" onclick="pickAxis(${i}, '${L}')">
                <b>${L}</b><span>${label}</span>
              </button>`).join("")}
          </div>
        </div>`).join("")}
      <div class="mbti-out">내 유형 <b id="mbti-out">${draftMbti() || "· · · ·"}</b></div>
    </div>

    <div class="field">
      <label>내 매력 3가지 <span class="req">*</span> <span class="muted" style="font-weight:600">— 프로필에 그대로 보여요</span></label>
      ${[0,1,2].map(i => `
        <div class="charm-row">
          <div class="num">${i+1}</div>
          <div class="charm-input">
            <input class="input" id="f-charm${i}" maxlength="30" value="${esc(d.charms[i]||"")}"
                   placeholder="${["예) 주말마다 클라이밍하러 가요","예) 요리를 꽤 잘하는 편입니다","예) 고민을 끝까지 들어줘요"][i]}"
                   oninput="charmCount(${i})">
            <span class="charm-cnt" id="charm-cnt${i}">${(d.charms[i]||"").length}/30</span>
          </div>
        </div>`).join("")}
      <div class="tiny muted" style="margin-top:2px;line-height:1.6">
        짧은 태그도, 문장도 괜찮아요. 목록에서는 한 줄로 요약되고 <b>프로필을 열면 전부 보입니다.</b>
      </div>
    </div>`;

  return `
  <div class="screen no-nav">
    <div class="topbar">
      <button class="btn-sm btn-ghost" onclick="${st>1?`regStep(${st-1})`:"regExit()"}">← ${st>1?"이전":"뒤로"}</button>
      ${ev?phaseBadge(ev):""}
    </div>
    <div style="margin-bottom:16px">
      <div class="eyebrow">${esc(ev ? ev.name : "")}</div>
      <h1 style="font-size:24px;margin-top:8px">참가자 등록</h1>
    </div>

    <div class="steps">
      ${STEPS.map((t,i) => `
        <div class="step ${st===i+1?"on":""} ${st>i+1?"done":""}" onclick="regStep(${i+1})">
          <i>${st>i+1?"✓":i+1}</i><span>${t}</span>
        </div>`).join("")}
    </div>

    ${!gate.ok ? `<div class="note warn" style="margin-bottom:16px">⏳ ${esc(gate.why)}</div>` : ""}

    ${st===1 ? step1() : st===2 ? step2() : step3()}

    <div class="err" id="f-err"></div>
    ${st < 3
      ? `<button class="btn btn-primary" onclick="regStep(${st+1})">다음 →</button>`
      : `<button class="btn btn-primary" ${gate.ok?"":"disabled"} onclick="submitRegister()">입장하기 🎉</button>`}
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   타이머 — 전체 재렌더 없이 카운트다운만 갱신
   ══════════════════════════════════════════════════════════ */
setInterval(() => {
  let needRender = false;
  document.querySelectorAll("[data-countdown]").forEach(el => {
    const t = Number(el.dataset.countdown);
    if(!t) return;
    el.textContent = fmtDur(t - Date.now());
    if(t - Date.now() <= 0) needRender = true;
  });
  for(const ev of DB.events){
    const before = ev.phase;
    phaseOf(ev);
    if(ev.phase !== before) needRender = true;
  }
  if(needRender) render();
}, 1000);

render();
</script>
</body>
</html>
