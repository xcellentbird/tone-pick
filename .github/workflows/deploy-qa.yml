# qa 브랜치 → 연습용 환경 자동 배포.
#
# 프로덕션(main → tone-pick)은 Cloudflare Workers Builds 가 맡고 있다. QA 도 대시보드에서
# 연결할 수 있지만, 그러려면 워커마다 저장소를 다시 이어야 하고 Deploy command 에
# `--env qa` 를 넣는 걸 잊으면 **연습용 브랜치가 프로덕션으로 나간다.**
# 여기서는 그 명령을 저장소가 들고 있게 한다 — 잊을 수가 없다.
#
# 필요한 것: 저장소 시크릿 CLOUDFLARE_API_TOKEN 하나.
#   Cloudflare 대시보드 → My Profile → API Tokens → Create Token
#   → "Edit Cloudflare Workers" 템플릿 → 이 계정으로 범위 지정
#
# 시크릿이 없으면 조용히 건너뛴다. 아직 안 넣었다고 CI 가 빨개지지 않게.
name: Deploy QA

on:
  push:
    branches: [qa]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 관문은 여기서도 지난다. 깨진 코드가 QA 에 올라가면 리허설이 리허설이 아니게 된다
      - run: npm run check
      - run: npm test

      - name: 토큰이 있는지
        id: gate
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ready != 'true'
        run: |
          echo "CLOUDFLARE_API_TOKEN 이 없어 배포를 건너뜁니다."
          echo "저장소 Settings → Secrets and variables → Actions 에 추가하면 이 워크플로가 QA 를 배포합니다."

      - if: steps.gate.outputs.ready == 'true'
        run: npm run build
      - if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # --env qa 를 여기 박아둔다. 빠뜨리면 프로덕션으로 나간다
          command: deploy --env qa
