# PR 이 들어가기 전에 기계가 먼저 본다.
#
# Cloudflare 빌드는 테스트를 돌리지 않고 그대로 배포한다. 그래서 여기가 유일한 관문이다 —
# 이 워크플로가 없으면 테스트는 있으나 마나다.
#
# 차선은 둘이다.
#
#   check          모든 PR·푸시. 타입 + 문구 + 규칙 테스트 + 빌드.
#                  **문서만 바뀐 PR 은 ADR 검사만 돈다** (아래 `무엇이 바뀌었나`)
#   release-guard  **프로덕션으로 가는 길에서만.** 옛 스키마 · 번들 예산
#
# 왜 갈랐나 — 병렬로 더 쪼개면 잡마다 checkout+setup-node+npm ci 9초를 다시 내고 **러너 수요만 는다.**
# 그런데 이 저장소가 실제로 다친 곳이 러너다 — v2.0.0(#227)·#247·#248 이
# "러너를 배정하지 못해 필수 검사가 큐에 머물러" bypass 로 머지됐고, 한 번은 74분을 기다렸다.
# 그래서 잡을 늘리는 방향이 아니라 **늘어날 자리를 프로덕션 길목 하나로 묶는다.** (ADR-66)
# 빨라지는 건 **한 잡 안에서** 한다 — 타입 검사·빌드는 테스트와 서로 기다릴 이유가 없어 겹쳐 돌린다.
name: CI

on:
  pull_request:
    branches: [main, qa]
    # `ready_for_review` 를 빼지 마라. 기본값은 opened·synchronize·reopened 뿐이라,
    # **드래프트로 열었다가 준비됨으로 바꾼 PR 은 CI 를 영영 못 받는다.**
    # 옛 실행 결과가 초록으로 남아 있어 눈으로는 통과한 것처럼 보이고,
    # `automerge` 는 그때의 base_ref 로 판단해 조용히 건너뛴다.
    # `edited`(베이스 변경)도 같은 구멍이지만 그건 커밋을 밀면 풀린다 — 이건 안 풀린다.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, qa]

# 지나간 커밋의 실행을 세워둔다. 세 번 연달아 밀면 세 번 다 끝까지 돌았고, 의미는 마지막 하나뿐이다.
#
# ⚠️ **`cancel-in-progress` 를 그냥 true 로 두지 마라.** main·qa 의 push 실행은
# 기록이자 배포 신호다 — 릴리스를 밀어넣는 중에 다음 머지가 그걸 취소하면
# 무엇이 프로덕션에 나갔는지 말해주는 초록이 사라진다.
# `group` 을 ref 로 가르고 **PR 일 때만** 취소한다 (PR 은 `refs/pull/N/merge` 라 서로 안 겹친다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 의 머지 커밋과 **그 첫 부모(= 베이스)** 를 견줘야 무엇이 바뀌었는지 안다. 부모까지 받는다
          fetch-depth: 2

      # ─── 무엇이 바뀌었나 ───────────────────────────────────────────
      # **문서(docs/ · *.md)만 바뀐 PR 은 코드 검사를 건너뛴다.** 문서가 깰 수 있는 것은
      # ADR 목차·참조뿐이라 그것만 본다 (`check:adr` — 의존성 없이 돈다, 1초).
      # 코드·설정·테스트·스크립트가 **하나라도** 섞이면 전부 돈다. main·qa 푸시는 늘 전부 돈다.
      # 건너뛰어도 잡은 초록으로 끝난다 — `automerge` 가 이 잡을 기다리고, 필수 검사로 걸려 있어도 막히지 않는다.
      - name: 무엇이 바뀌었나
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "lane=docs" >> "$GITHUB_OUTPUT"
            echo "문서만 바뀐 PR — ADR 검사만 돈다" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: ADR 검사 (문서만 바뀐 PR)
        if: steps.scope.outputs.lane == 'docs'
        run: npm run check:adr

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.lane != 'docs'
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.lane != 'docs'
        run: npm ci
      # 시크릿은 필요 없다. 테스트용 값은 vitest.config.ts 가 직접 넣는다
      #
      # **셋을 겹쳐 돌린다.** 타입 검사는 한 코어로 돌고 테스트는 코어를 나눠 쓴다 — 기다릴 이유가 없다
      # (실측: 차례로 52초 → 겹쳐서 41초). 테스트는 앞에서 흘려 보여주고, 나머지 둘의 출력은 끝에 묶어 붙인다.
      # `set +e` 를 빼지 마라 — 기본 셸은 `-e` 라 테스트가 빨개지는 순간 나머지 둘을 기다리지 않고 끝난다.
      - name: 검사 · 테스트 · 빌드
        if: steps.scope.outputs.lane != 'docs'
        run: |
          set +e
          npm run check > check.log 2>&1 & C=$!
          npm run build > build.log 2>&1 & B=$!
          npm test; T=$?
          wait $C; C=$?
          wait $B; B=$?
          echo "::group::npm run check (exit $C)"; cat check.log; echo "::endgroup::"
          echo "::group::npm run build (exit $B)"; cat build.log; echo "::endgroup::"
          [ $C -eq 0 ] || echo "::error::npm run check 실패 — 위 'npm run check' 묶음을 펼쳐 보세요"
          [ $B -eq 0 ] || echo "::error::npm run build 실패 — 위 'npm run build' 묶음을 펼쳐 보세요"
          exit $(( C || B || T ))

  # ─────────────────────────────────────────────────────────────
  # **배포되는 물건**에 대한 검사. main 으로 가는 PR 과 main 푸시에서만 돈다.
  #
  #   test:release   옛 모양으로 저장된 회차를 지금 코드로 열어본다
  #   check:bundle   번들이 조용히 불어나지 않았나
  #
  # 둘 다 `npm test` 가 구조적으로 못 잡는 것이다. 앞의 것은 CLAUDE.md 가 적어둔 그대로 —
  # 테스트 DO 는 언제나 새것이라 옛 표를 만나지 않는다. 실제로 `SCHEMA` 에 토큰 인덱스를
  # 올려 DO 를 죽여봤더니 **기존 517개가 전부 통과했다.**
  #
  # qa 에는 안 붙인다. feature PR 은 전부 qa 로 오므로 여기 붙이면 매 PR 이 러너를
  # 하나씩 더 잡는다 — 위에 적은 그 사고를 다시 부르는 길이다.
  # 옛 DO 를 진짜로 만나는 자리는 어차피 QA 배포 뒤이고, 이 잡은 그 앞의 한 겹이다.
  #
  # ⚠️ 이 잡은 **필수 검사가 아니다.** 저장소 설정에서 걸지 않는 한 빨개도 머지를 막지 않는다 —
  # 막고 싶으면 `qa → main` 브랜치 보호에 `release-guard` 를 더해라.
  # 지금은 사람이 누르는 머지 하나뿐이라(그게 main 의 의식이다) 눈으로 본다.
  release-guard:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:release → build → check:bundle. 예산은 빌드 결과를 재므로 순서가 곧 뜻이다
      - run: npm run guard

  # ─────────────────────────────────────────────────────────────
  # qa 로 가는 PR 은 CI 만 통과하면 자동으로 들어간다.
  #
  # 연습용 환경은 "일단 올려보고 확인하는" 자리다. 사람이 머지 버튼을 누르는 의식은
  # 프로덕션에만 둔다. 대신 관문(check)은 여기서도 똑같이 지난다 —
  # 깨진 코드가 QA 에 올라가면 리허설이 리허설이 아니게 된다.
  # **드래프트는 건너뛴다.** `gh pr merge` 는 드래프트를 거절하므로, 안 걸러내면
  # 아직 볼 준비가 안 됐다고 말한 PR 에서 CI 가 빨갛게 죽는다 —
  # 실패가 코드 탓처럼 보여서 진짜 실패를 찾는 눈을 흐린다.
  # 준비됨으로 바꾸면 위의 `ready_for_review` 가 CI 를 다시 돌리고, 그때 이 잡이 붙는다.
  automerge:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'qa'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 브랜치는 지우지 않는다. 같은 브랜치로 main 에 PR 이 열려 있을 수 있다
      - run: gh pr merge "$NUMBER" --repo "$REPO" --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
