# PR 이 들어가기 전에 기계가 먼저 본다.
#
# Cloudflare 빌드는 테스트를 돌리지 않고 그대로 배포한다. 그래서 여기가 유일한 관문이다 —
# 이 워크플로가 없으면 64개 테스트는 있으나 마나다.
#
# 세 가지를 본다.
#   check  타입(클라이언트·Worker·테스트) + 문구가 copy.ts 밖에 하드코딩됐는지
#   test   규칙 테스트(workerd 안에서 진짜 DO 로) + 화면 테스트
#   build  배포될 물건이 실제로 만들어지는지
name: CI

on:
  pull_request:
    branches: [main, qa]
    # `ready_for_review` 를 빼지 마라. 기본값은 opened·synchronize·reopened 뿐이라,
    # **드래프트로 열었다가 준비됨으로 바꾼 PR 은 CI 를 영영 못 받는다.**
    # 옛 실행 결과가 초록으로 남아 있어 눈으로는 통과한 것처럼 보이고,
    # `automerge` 는 그때의 base_ref 로 판단해 조용히 건너뛴다.
    # `edited`(베이스 변경)도 같은 구멍이지만 그건 커밋을 밀면 풀린다 — 이건 안 풀린다.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, qa]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 시크릿은 필요 없다. 테스트용 값은 vitest.config.ts 가 직접 넣는다
      - run: npm run check
      - run: npm test
      - run: npm run build

  # ─────────────────────────────────────────────────────────────
  # qa 로 가는 PR 은 CI 만 통과하면 자동으로 들어간다.
  #
  # 연습용 환경은 "일단 올려보고 확인하는" 자리다. 사람이 머지 버튼을 누르는 의식은
  # 프로덕션에만 둔다. 대신 관문(check)은 여기서도 똑같이 지난다 —
  # 깨진 코드가 QA 에 올라가면 리허설이 리허설이 아니게 된다.
  # **드래프트는 건너뛴다.** `gh pr merge` 는 드래프트를 거절하므로, 안 걸러내면
  # 아직 볼 준비가 안 됐다고 말한 PR 에서 CI 가 빨갛게 죽는다 —
  # 실패가 코드 탓처럼 보여서 진짜 실패를 찾는 눈을 흐린다.
  # 준비됨으로 바꾸면 위의 `ready_for_review` 가 CI 를 다시 돌리고, 그때 이 잡이 붙는다.
  automerge:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'qa'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 브랜치는 지우지 않는다. 같은 브랜치로 main 에 PR 이 열려 있을 수 있다
      - run: gh pr merge "$NUMBER" --repo "$REPO" --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
