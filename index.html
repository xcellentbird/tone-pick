<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      interactive-widget=resizes-content — 소프트 키보드가 뜨면 **레이아웃 뷰포트 자체를** 줄인다.
      그래야 100dvh 와 `bottom: 0` 이 키보드 위로 따라온다 (안드로이드 크롬).
      iOS 사파리는 이 속성을 모르므로 거기서는 `--kb`(lib/keyboard.ts)가 맡는다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#151118" />
    <!--
      **로고를 번들보다 먼저 받는다.** 참가 링크의 첫 화면에서 가장 큰 그림이고,
      번들을 거치면 JS 가 다 온 뒤에야 요청이 나간다 — 그게 1초 뒤다.
      `/j/*` 가 아닌 화면에서는 안 쓰지만 42KB 한 번이라 값이 싸다.
    -->
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high" />
    <!--
      대체 화면은 **늦게** 나타난다.

      HTML 안에 있으니 브라우저가 먼저 그리고, React 가 뜨면서 덮는다 — 그대로 두면
      **정상 경로에서 매번 "화면을 불러오지 못했어요" 가 번쩍인다.** 하얀 화면보다 나쁘다.
      멀쩡히 도는 앱이 매번 실패했다고 말하면, 진짜 실패했을 때 아무도 안 믿는다.

      ⚠️ **색 네 개는 `theme.css` 의 토큰과 손으로 맞춘다.** 여기서는 변수를 못 쓴다 —
      CSS 파일이 같이 안 붙었을 수 있는 상황을 위한 자리라 인라인이어야 한다.
      그래서 토큰이 바뀌면 **여기가 조용히 어긋난다.** 실제로 세 개가 다 어긋나 있었다:
      바탕은 옛 `--bg`(#131316), 버튼 보라(#6d48e5)와 `theme-color`(#12101a)는
      어느 토큰과도 맞은 적이 없었다.
      바탕 `--bg` · 글자 `--fg` · 버튼 `--accent` · 흐린 글씨 `--dim`, 그리고 `theme-color` 도 `--bg`.

      그래서 6초 뒤에야 보이게 한다. 그 전까지는 어두운 바탕만 — 앱이 자료를 기다릴 때
      그리는 화면(`.screen` 빈 상태)과 같은 모습이라 이질감이 없다.
      **JS 없이 CSS 만으로 한다.** 번들이 안 붙은 상황을 위한 자리이므로 스크립트에 기댈 수 없다.

      6초는 느린 모바일 회선에서 417KB 번들이 도착하고도 남는 시간이다.
      짧으면 잘 되는 사람이 놀라고, 길면 진짜 실패한 사람이 오래 기다린다.
    -->
    <style>
      /*
       * **첫 프레임부터 어둡다.** CSS 는 HTML 보다 160ms 쯤 늦게 오는데, 그 사이에
       * 그릴 것이 생기면(아래 스켈레톤) **흰 바탕에** 그려진다 — 어두운 앱에서 그 번쩍임은
       * 느린 것보다 나쁘다. 지금까지 안 보였던 건 그 구간에 그릴 것이 없어서였을 뿐이다.
       * 값은 `theme.css` 의 `--bg` 와 같아야 한다 (`npm run check:theme` 가 본다).
       */
      html { background: #151118; color-scheme: dark }
      @keyframes bootFailIn { to { opacity: 1 } }
      .bootFail { opacity: 0; animation: bootFailIn 0s 6s forwards }
      /* 참가 링크에서만 선다. 표시는 위 스크립트가 `<html>` 에 남긴다 */
      #tpSkeleton { display: none }
      [data-join] #tpSkeleton { display: flex }
    </style>
    <!--
      탭에 뜨는 이름. **저장소 이름(`tone-pick`)이 아니라 파티 이름이다** —
      참가자는 파티 중에 탭을 여러 개 열어두고, 그중에서 우리를 찾아야 한다.

      회차 이름을 쓰지 않는 이유는 로고와 같다: 회차 이름은 운영자가 친 글자라
      회차마다 다르고, 이 파일은 정적이라 그걸 알 수 없다.
    -->
    <!--
      **번들보다 먼저 회차를 묻는다.**

      참가 링크를 열면 회차 조회가 첫 화면에 꼭 필요한데, 그 요청은 번들이 다 내려와
      실행된 **뒤에야** 나갔다 — 4G 에서 재보니 1241ms 지점이었다.
      요청 자체는 150ms 인데 그 앞의 1초를 기다리는 데 쓴 셈이다.

      여기 인라인으로 두면 HTML 을 파싱하는 순간(~165ms) 출발해서 번들과 **나란히** 달린다.
      React 가 올라올 때는 답이 이미 손에 있다.

      ⚠️ **`bootFail` 과 같은 이유로 인라인이다** — 번들에 기대면 이 자리가 성립하지 않는다.
      ⚠️ 실패해도 조용히 넘어간다. 앱은 평소대로 자기가 다시 묻는다 (`lib/boot.ts`).
      ⚠️ `/events/by-id` 는 **토큰만** 보고 세션·`x-tp-ref` 를 안 읽는다. 그래서 미리 불러도
         앱이 부르는 것과 같은 답이 온다. **세션을 읽는 요청을 여기 넣지 마라** —
         탭마다 사람이 다른데(ADR-44) 이 자리는 이름표를 실을 수 없다.
    -->
    <script>
      (function () {
        var m = location.pathname.match(/^\/j\/([0-9a-fA-F]+)\/([0-9a-fA-F]+)(?:\/|$)/);
        if (!m) return;
        /*
         * 참가 링크일 때만 모양을 세운다 — 다른 화면에서 이 자리가 번쩍이면 안 된다.
         *
         * ⚠️ **요소를 찾지 않고 `<html>` 에 표시를 남긴다.** 이 스크립트는 `<head>` 에서
         *    도는데 스켈레톤은 `<body>` 라, `getElementById` 는 아직 `null` 이다.
         *    `documentElement` 는 그때도 있다.
         */
        document.documentElement.setAttribute("data-join", "");
        if (!window.fetch) return;
        var url = "/api/events/by-id/" + m[1] + "?t=" + encodeURIComponent(m[2]);
        var p = fetch(url, { credentials: "include" }).then(function (r) {
          if (!r.ok) throw r.status;
          return r.json();
        });
        p.catch(function () {}); // 아무도 안 받아가도 콘솔에 경고를 남기지 않는다
        window.__tpBoot = { url: url, p: p };
      })();
    </script>
    <title>TONE PARTY</title>

    <!--
      아이콘은 로고의 **보라색 O 와 발끝**만 잘라 쓴다. 로고 전체는 16px 에서 뭉갠다 —
      `TONE` 네 글자가 4px 씩 나눠 갖는다.

      ⚠️ **배경을 투명하게 두지 마라.** 발끝이 크림색이라 밝은 탭 배경에서 사라진다.
      그렇다고 앱 바탕(`--bg`)으로 채우지도 않는다 — **다크 모드 탭바에 아이콘이 묻힌다.**
      크림으로 채워 밝은 탭·어두운 탭 양쪽에서 도드라지게 한다.
      만드는 법과 그 값을 고른 근거는 `design/README.md`.
    -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!--
      **번들이 안 붙었을 때 남는 화면.** React 가 뜨면 이 자리를 통째로 덮는다.

      JS 가 실행되지 않는 상황(망 끊김, 옛 캐시가 사라진 해시를 가리킴, 확장 프로그램 충돌)에는
      에러 경계도 소용이 없다 — 경계 자체가 그 번들 안에 있기 때문이다.
      그래서 여기 있는 문장과 모양은 **전부 인라인**이다. CSS 파일도 같이 못 붙었을 수 있다.

      문구가 `src/shared/copy.ts` 밖에 있는 유일한 자리다. 거기서 가져오려면 번들이 붙어야 하고,
      번들이 안 붙은 상황을 위한 문장이라 가져올 수가 없다. `copy.ts` 의 `FAIL` 을 고치면 여기도 같이 본다.
      (`check:copy` 는 `src/` 만 훑으므로 이 파일은 검사에 안 걸린다.)
    -->
    <!--
      **먼저 보이는 것이 먼저다.**

      참가 링크를 열면 HTML 은 160ms 에 오는데 화면은 1초 넘게 검었다 — 번들(372KB)이
      다 와서 React 가 그릴 때까지 `#root` 가 비어 있었기 때문이다. CSS 는 320ms 에
      도착해 배경만 칠하고 있었다.

      그래서 **모양만 먼저 세운다.** 데이터도 문구도 없다 — 로고와 자리 표시뿐이라
      `copy.ts` 와 겹치지 않고, 거짓을 말할 것도 없다. React 가 올라오면 통째로 갈린다.

      ⚠️ **스타일을 인라인으로 둔다.** CSS 보다 먼저 그려지는 자리라 클래스에 기댈 수 없다.
      ⚠️ **`/j/*` 에서만 켠다.** `index.html` 은 모든 경로에 나가므로, 그냥 두면
         참가자 홈·운영자 콘솔에서도 이 모양이 한 번 번쩍인다.
      ⚠️ 로고 크기는 `Join.tsx` 와 같아야 한다 — 다르면 React 가 그리는 순간 튄다.
    -->
    <div id="root">
      <div id="tpSkeleton"
           style="min-height:100dvh;flex-direction:column;align-items:center;
                  padding:0 16px calc(32px + env(safe-area-inset-bottom));text-align:center">
        <img src="/logo.webp" alt="" aria-hidden width="640" height="455"
             style="display:block;width:min(58%,260px);height:auto;margin:7vh 0 0" />
        <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%">
          <span style="display:block;width:84px;height:13px;border-radius:999px;background:#28212d"></span>
          <span style="display:block;width:min(72%,240px);height:24px;border-radius:8px;background:#28212d"></span>
          <span style="display:block;width:40px;height:1px;background:#362d3c"></span>
          <span style="display:block;width:min(56%,180px);height:15px;border-radius:999px;background:#28212d"></span>
        </div>
        <span style="display:block;width:100%;max-width:420px;height:52px;border-radius:8px;
                     background:#1e1922;border:1px solid #362d3c;margin-top:28px"></span>
      </div>
      <div class="bootFail" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#151118;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;text-align:center">
        <p style="margin:0;font-size:16px">화면을 불러오지 못했어요</p>
        <button onclick="location.reload()" style="min-height:44px;padding:0 20px;border:none;border-radius:8px;background:#a98fff;color:#fff;font-size:16px;font-weight:600;font-family:inherit">새로고침</button>
        <p style="margin:0;font-size:12px;color:#a8a8b0">새로고침해도 안 되면 운영자에게 이 화면을 보여주세요.</p>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
